version: "3.8"

services:
  # ── Streamlit App ──────────────────────────────────
  app:
    build: .
    container_name: seasonalpha-app
    restart: always
    ports:
      - "8501:8501"
    # Alle Vars aus .env (BREVO_API_KEY, ADMIN_EMAIL, SENDER_*,
    # UNSUBSCRIBE_SECRET, SUPABASE_ANON_KEY, …) werden durchgereicht.
    # Explizite environment-Liste darunter ist nur noch Fallback-Default.
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./logs:/app/logs
      - ./blog/output:/app/blog/output
      # landing/data wird von compute_brier_stats.py beschrieben
      # (brier_stats.json, ggf. weitere precomputed JSONs fuers Frontend).
      # nginx liest aus dem gleichen Host-Ordner read-only.
      - ./landing/data:/app/landing/data
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx Reverse Proxy + SSL ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: seasonalpha-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./landing:/app/landing:ro
      - ./seo/output:/app/seo/output:ro
      - ./seo/tools:/app/seo/tools:ro
      - ./blog/output:/app/blog/output:ro
      - ./seo/output/sitemap.xml:/app/static/sitemap.xml:ro
      - ./seo/output/robots.txt:/app/static/robots.txt:ro
      - ./seo/output/llms.txt:/app/static/llms.txt:ro
    depends_on:
      - app

  # ── Certbot (SSL) ─────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: seasonalpha-certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ── Umami Analytics (DSGVO-konform) ───────────────
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: seasonalpha-umami
    restart: always
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-umami_secret}@umami-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET:-replace_me_with_random_string}
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    image: postgres:15-alpine
    container_name: seasonalpha-umami-db
    restart: always
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:-umami_secret}
      - POSTGRES_DB=umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:
