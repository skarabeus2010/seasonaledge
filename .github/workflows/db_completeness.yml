name: DB Completeness Audit

# Woechentlicher Tiefen-Audit der Supabase-DB ueber 4 Dimensionen
# (freshness, coverage, gaps, events). Geht ueber den taeglichen
# daily_health_check.py hinaus: prueft Ticker-Abdeckung in JEDER abgeleiteten
# Tabelle, historische Datumsluecken und Event-Tabellen. Schliesst Daten-Layer-
# Luecken automatisch (--fix) und schickt einen Brevo-Report an ADMIN_EMAIL.
#
# Laufzeit ~5-12 min (Coverage = per-Ticker Counts, Gap-Scan paginiert).
# Bewusst woechentlich statt taeglich; Freshness deckt der Daily-Check taeglich ab.

on:
  schedule:
    # So 05:00 UTC — NACH Full-Scanner (So 03:00) + Nightly (Fr 20:30).
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      dims:
        description: "Dimensionen (Komma): freshness,coverage,gaps,events"
        required: false
        default: "freshness,coverage,gaps,events"
        type: string
      gap_years:
        description: "Gap-Scan-Tiefe in Jahren (0 = volle Historie)"
        required: false
        default: "2"
        type: string
      fix:
        description: "Daten-Layer-Lücken auto-backfillen (--fix)"
        required: false
        default: true
        type: boolean
      fix_derived:
        description: "Teure Recomputes (ki/scanner/regime/events) (--fix-derived)"
        required: false
        default: false
        type: boolean
      mail:
        description: "Brevo-Report an ADMIN_EMAIL senden"
        required: false
        default: true
        type: boolean

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: DB completeness audit
        uses: appleboy/ssh-action@v1
        env:
          SA_EVENT:     ${{ github.event_name }}
          SA_DIMS:      ${{ github.event.inputs.dims }}
          SA_GAP_YEARS: ${{ github.event.inputs.gap_years }}
          SA_FIX:       ${{ github.event.inputs.fix }}
          SA_DERIVED:   ${{ github.event.inputs.fix_derived }}
          SA_MAIL:      ${{ github.event.inputs.mail }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 55m
          envs: SA_EVENT,SA_DIMS,SA_GAP_YEARS,SA_FIX,SA_DERIVED,SA_MAIL
          script: |
            set -euo pipefail

            # FAIL-CLOSED gegen eine verlorene Übertragung. Die Polarität hier ist
            # ABSICHT: leer heisst an, weil der Zeitplan-Lauf keine Eingaben hat
            # (`!= "false"`). Genau deshalb ist ein verlorener Dispatch-Wert
            # gefährlich — wer `fix=false` setzt und dessen Wert unterwegs
            # verliert, bekommt stillschweigend `--fix` samt Backfill.
            : "${SA_EVENT?Uebertragung fehlgeschlagen: SA_EVENT fehlt}"
            : "${SA_DIMS?Uebertragung fehlgeschlagen: SA_DIMS fehlt}"
            : "${SA_GAP_YEARS?Uebertragung fehlgeschlagen: SA_GAP_YEARS fehlt}"
            : "${SA_FIX?Uebertragung fehlgeschlagen: SA_FIX fehlt}"
            : "${SA_DERIVED?Uebertragung fehlgeschlagen: SA_DERIVED fehlt}"
            : "${SA_MAIL?Uebertragung fehlgeschlagen: SA_MAIL fehlt}"

            if [ "$SA_EVENT" = "workflow_dispatch" ]; then
              for wert in "$SA_FIX" "$SA_DERIVED" "$SA_MAIL"; do
                case "$wert" in
                  true|false) ;;
                  *) echo "[db-completeness] FEHLER: Boolean-Eingabe ist '$wert'," \
                          "erwartet true oder false — Abbruch"; exit 1 ;;
                esac
              done
            fi

            DIMS="${SA_DIMS:-freshness,coverage,gaps,events}"
            GAP_YEARS="${SA_GAP_YEARS:-2}"

            # Freitext gegen die erlaubten Werte prüfen, statt ihn in die
            # Kommandozeile zu reichen.
            case "$GAP_YEARS" in
              ''|*[!0-9]*) echo "[db-completeness] FEHLER: gap_years ist keine Zahl"; exit 1 ;;
            esac
            IFS=',' read -r -a _dims <<< "$DIMS"
            for d in "${_dims[@]}"; do
              case "$d" in
                freshness|coverage|gaps|events) ;;
                *) echo "[db-completeness] FEHLER: unbekannte Dimension '$d'"; exit 1 ;;
              esac
            done

            flags=(--dim "$DIMS" --gap-years "$GAP_YEARS")
            if [ "$SA_FIX" != "false" ];     then flags+=(--fix); fi
            if [ "$SA_DERIVED" = "true" ];   then flags+=(--fix-derived); fi
            if [ "$SA_MAIL" != "false" ];    then flags+=(--mail); fi

            echo "[db-completeness] event=$SA_EVENT flags=${flags[*]}"
            docker exec seasonalpha-app python3 scripts/check_db_completeness.py \
              "${flags[@]}" 2>&1 | tail -120

      - name: Calendar rules verification (Prüfagent)
        # Deterministischer Check aller 9 Handels-Kalender-Regeln (Code + DB,
        # beide Audit-Richtungen). Exit 1 bei FAIL → Workflow schlägt fehl →
        # GitHub-Notification. Fängt u.a. Kalender-Drift + zu kurze HKEX/KRX-Tabellen
        # (neue Jahres-Daten ohne Eintrag → Gap-Residual > Soll → FAIL).
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            echo "[calendar-rules] Prüfagent: $(date)"
            docker exec seasonalpha-app python3 scripts/verify_calendar_rules.py
