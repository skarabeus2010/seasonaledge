name: Setup Umami Analytics

on:
  workflow_dispatch:  # Manueller Trigger

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Umami on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/seasonaledge

            echo "=== 1. .env um Umami-Variablen erweitern ==="
            # Nur hinzufuegen wenn noch nicht vorhanden
            grep -q 'UMAMI_DB_PASSWORD' .env || echo "UMAMI_DB_PASSWORD=$(openssl rand -hex 16)" >> .env
            grep -q 'UMAMI_APP_SECRET' .env || echo "UMAMI_APP_SECRET=$(openssl rand -hex 32)" >> .env
            grep -q 'UMAMI_WEBSITE_ID' .env || echo "UMAMI_WEBSITE_ID=pending" >> .env
            echo "  .env erweitert"

            echo "=== 2. Docker Container starten ==="
            docker compose up -d --build
            echo "  Container gestartet, warte 15s auf Umami-Init..."
            sleep 15

            echo "=== 3. Umami Status pruefen ==="
            docker compose ps umami
            # Test ob Umami antwortet
            curl -sf http://localhost:3000/api/heartbeat && echo "  Umami laeuft!" || echo "  WARNUNG: Umami antwortet nicht"

            echo "=== 4. Credentials injizieren ==="
            bash deploy/inject_credentials.sh /opt/seasonaledge

            echo "=== 5. Nginx neuladen ==="
            docker compose restart nginx

            echo ""
            echo "========================================="
            echo "Umami Setup abgeschlossen!"
            echo "========================================="
            echo ""
            echo "NAECHSTE SCHRITTE (manuell):"
            echo "1. Browser: https://seasonalpha.ai/umami/"
            echo "2. Login: admin / umami"
            echo "3. PASSWORT SOFORT AENDERN!"
            echo "4. Settings > Websites > Add website"
            echo "   Name: SeasonAlpha"
            echo "   Domain: seasonalpha.ai"
            echo "5. Website-ID kopieren und hier eintragen:"
            echo "   ssh root@178.104.75.46"
            echo "   sed -i 's/UMAMI_WEBSITE_ID=.*/UMAMI_WEBSITE_ID=DEINE-ID/' /opt/seasonaledge/.env"
            echo "   bash /opt/seasonaledge/deploy/inject_credentials.sh /opt/seasonaledge"
            echo "   docker compose restart nginx"
            echo ""
