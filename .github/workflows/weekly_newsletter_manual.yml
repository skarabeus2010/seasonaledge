name: Weekly Newsletter (Manual Trigger)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sende-Modus"
        required: true
        default: "test"
        type: choice
        options:
          - test       # Nur an ADMIN_EMAIL
          - dry-run    # HTML auf Disk rendern, kein Versand
          - live       # An alle aktiven Subscriber

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run weekly newsletter on VPS
        uses: appleboy/ssh-action@v1
        env:
          SA_MODE: ${{ github.event.inputs.mode }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 18m
          envs: SA_MODE
          script: |
            set -uo pipefail
            # FAIL-CLOSED: eine nicht angekommene Eingabe darf nicht in den
            # Standard fallen. Auf dem Zeitplan sind die Variablen gesetzt und
            # LEER, bei Transportfehler UNGESETZT — ${VAR?} unterscheidet das.
            #
            # Der case-Zweig unten bricht bei einem unbekannten Modus schon ab —
            # dieser sichere Zweig bleibt unveraendert. Neu ist nur, dass ein
            # UNGESETZTES SA_MODE ebenfalls abbricht statt in den leeren String
            # und damit in den unbekannten Modus zu laufen.
            : "${SA_MODE?Uebertragung fehlgeschlagen: SA_MODE fehlt}"
            MODE="$SA_MODE"
            args=()
            case "$MODE" in
              test)
                args=(--test)
                echo "[weekly-manual] Test-Versand an ADMIN_EMAIL"
                ;;
              dry-run)
                args=(--dry-run)
                echo "[weekly-manual] Dry-Run (HTML auf Disk, kein Versand)"
                ;;
              live)
                args=()
                echo "[weekly-manual] LIVE-Versand an alle Subscriber"
                ;;
              *)
                echo "[weekly-manual] Unbekannter Modus: $MODE"
                exit 1
                ;;
            esac
            docker exec seasonalpha-app python3 scripts/weekly_newsletter.py ${args[@]+"${args[@]}"} 2>&1 | tail -60
            echo "[weekly-manual] Finished: $(date)"
