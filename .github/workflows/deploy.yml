name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/seasonaledge
            git checkout -- seo/output/ 2>/dev/null || true
            git pull origin master
            pip install -q Jinja2 PyYAML 2>/dev/null || pip3 install -q Jinja2 PyYAML 2>/dev/null
            python3 seo/programmatic_seo_builder.py
            python3 blog/blog_builder.py --build
            docker compose up -d --build
            echo "Deploy done: $(date)"
