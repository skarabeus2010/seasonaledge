name: Deploy to VPS

on:
  push:
    branches: [master]

# Zwei Deploys arbeiten sonst gleichzeitig im selben Serververzeichnis.
# cancel-in-progress bewusst FALSE: ein mitten im Ausrollen abgebrochener Lauf
# liesse den Server in einem halben Zustand zurueck — schlimmer als warten.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Gate VOR dem Ausrollen. Die Probe braucht nur node und die Dateien im
      # Baum — keine Cron-Ausgaben, keine Zugangsdaten. Deshalb laeuft sie hier
      # auf dem Runner und nicht in der ssh-action: node ist auf ubuntu-latest
      # vorhanden, auf dem VPS nicht nachgewiesen. Fehlt node doch, endet der
      # Schritt mit "command not found" und damit ROT — nicht still gruen
      # (derselbe Fehler steckte 2026-09-11 im Zwillings-Waechter).
      # fetch-depth: 2, weil der Cache-Waechter HEAD gegen HEAD~1 vergleicht.
      # Der Standard 1 liefert kein HEAD~1 — Codex hat nachgestellt, dass der
      # Waechter dann „kein Woerterbuch geaendert" meldete und gruen durchlief.
      # Ein Gate, das seine eigene Voraussetzung nicht hat, prueft nichts.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Waechter - Maskierung auf /polymarket
        run: node scripts/js/probe_polymarket_maskierung.js
      # Prueft deploy/pruefe_commit.sh mit einem git-Stub, also BEVOR es auf dem
      # Server laeuft. Braucht nur bash und die Standardbibliothek.
      - name: Waechter - Abschnitte und Ladegeneration auf /polymarket
        run: node scripts/js/probe_polymarket_abschnitte.js
      - name: Waechter - Discovery nimmt nichts Unpassendes an
        run: python3 scripts/verify_polymarket_discovery.py
      - name: Waechter - Zwillinge Python/JS auf /polymarket
        run: python3 scripts/verify_polymarket_zwillinge.py
      - name: Waechter - Fed-Verteilung auf /polymarket
        run: node scripts/js/probe_polymarket_fedverteilung.js
      - name: Waechter - Kalibrierungs-Aussagen auf /polymarket
        run: node scripts/js/probe_polymarket_kalibrierung.js
      - name: Waechter - Divergenz-Analyse auf /polymarket
        run: node scripts/js/probe_polymarket_divergenz.js
      # Eine Textkorrektur ohne neue Cache-Kennung erreicht den Leser nicht:
      # i18n.js legt das Woerterbuch unter sa-i18n-<_JSON_VER> ab. Ein
      # wiederkehrender Besucher las sonst weiter die alte Fassung.
      # Phase B1: die Preisqualitaet am Erzeuger. Prueft OHNE Datenbank —
      # dass die Migration gelaufen ist, kann er nicht sehen; dafuer sind
      # die Abnahmeabfragen in scripts/sql/polymarket_schema_2026_10.sql da.
      - name: Waechter - Preisqualitaet auf /polymarket
        run: python3 scripts/verify_polymarket_preisqualitaet.py
      - name: Waechter - Cache-Kennung der Woerterbuecher
        run: python3 scripts/verify_i18n_cache_version.py
      - name: Waechter - Commit-Bindung des Deploys
        run: python3 scripts/verify_deploy_commitbindung.py
      # Boersenkalender gegen woertlich belegte Sollfaelle (offen UND zu, mit Quelle).
      # Nicht aus dem Code abgeleitet: ein Zwillingsvergleich findet keinen falschen
      # Feiertag, den beide Seiten teilen (Lesson 1B). Nur Standardbibliothek.
      - name: Waechter - Boersenkalender gegen belegte Sollfaelle
        run: python3 scripts/verify_kalender_sollfaelle.py

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          SA_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SA_SHA
          script: |
            cd /opt/seasonaledge

            # Holen zuerst: das veraendert den Arbeitsbaum NICHT, bringt aber die
            # Objekte des geprueften Commits auf den Server.
            : "${SA_SHA?Uebertragung fehlgeschlagen: SA_SHA fehlt}"
            if ! git fetch origin master; then
              echo "::error::git fetch fehlgeschlagen — Arbeitsbaum unveraendert."
              exit 1
            fi

            # Die Bindung laeuft aus der GEPRUEFTEN Fassung des Skripts, gezogen
            # aus dem geholten Commit — nicht aus dem Arbeitsbaum des Servers.
            # Zwei Gruende, beide von Codex gefunden: beim ersten Lauf liegt die
            # Datei im Arbeitsbaum noch nicht (der Deploy haette sich selbst
            # blockiert), und danach liefe die Server-Fassung, waehrend das Gate
            # auf dem Runner die neue geprueft hat.
            # Exklusiv angelegtes privates Verzeichnis, KEIN vorhersagbarer Pfad.
            # Der Server wird mit einem zweiten Projekt geteilt; eine feste Datei
            # wie /tmp/sa_pruefe_commit.sh koennte ein lokaler Nutzer vorher als
            # Symlink anlegen oder zwischen Schreiben und Ausfuehren austauschen —
            # und ausgefuehrt wird hier als root (Codex-Befund, Runde 5).
            SA_TMP=$(mktemp -d) || { echo "::error::mktemp -d fehlgeschlagen."; exit 1; }
            chmod 700 "$SA_TMP"
            trap 'rm -rf "$SA_TMP"' EXIT
            if ! git show "$SA_SHA:deploy/pruefe_commit.sh" > "$SA_TMP/pruefe_commit.sh"; then
              echo "::error::Geprueefte Fassung von deploy/pruefe_commit.sh nicht"
              echo "aus $SA_SHA lesbar — Abbruch, nichts veraendert."
              exit 1
            fi
            # Erst NUR vergleichen: bricht dieser Schritt ab, ist der
            # Arbeitsbaum unangetastet und die live gebundene Seite liefert
            # weiter den alten, funktionierenden Stand. Vorher liefen die
            # Reverts davor — ein Abbruch hinterliess landing/ mit
            # Credential-Platzhaltern (Codex, Abnahme 2026-10-08).
            if ! bash "$SA_TMP/pruefe_commit.sh" --nur-vergleich; then
              echo "::error::Commit-Bindung fehlgeschlagen — nichts veraendert."
              exit 1
            fi

            # Jetzt die Reverts: inject_credentials.sh aendert landing/
            # in-place, und diese Aenderungen blockieren sonst das Vorspulen.
            git checkout -- seo/output/ 2>/dev/null || true
            git checkout -- landing/ 2>/dev/null || true

            # Ab hier ist der Baum angefasst. Scheitert das Vorspulen, traegt
            # landing/ die Platzhalter aus dem Commit — deshalb wird die
            # Auslieferbarkeit vor dem Abbruch wiederhergestellt.
            if ! bash "$SA_TMP/pruefe_commit.sh"; then
              echo "::error::Commit-Bindung fehlgeschlagen — Auslieferbarkeit" \
                   "wird wiederhergestellt, nichts Neues ausgerollt."
              bash deploy/inject_credentials.sh /opt/seasonaledge || \
                echo "::error::Wiederherstellung fehlgeschlagen — Seite pruefen!"
              exit 1
            fi

            # Supabase Credentials in Landing-HTML injizieren
            bash deploy/inject_credentials.sh /opt/seasonaledge

            # Reihenfolge und Abbrueche (SEO-Review 2026-09-30): erst ALLE Seiten
            # bauen, dann die Sitemap daraus erzeugen, dann pruefen. Jeder dieser
            # Schritte bricht den Deploy ab — frueher waren EN-Build und
            # Blog-Build "non-fatal", ein spaeter erfolgreicher Befehl verdeckte
            # den Fehlschlag, und die Sitemap entstand vor dem Blog.
            # (Der fruehere nginx-Laufzeitfallback @en_runtime existiert nicht mehr.)
            scheitern() { echo "::error::$1"; exit 1; }

            # EN-Landing-Pages vorrendern -> landing/en/<slug>.html (statisch).
            # Laeuft NACH inject_credentials, damit die EN-Pages Credentials +
            # Cache-Bust erben.
            python3 landing/build_en.py --write || scheitern "build_en.py fehlgeschlagen"

            # Docker rebuild + restart, dann Blog (DE+EN) im Container bauen
            docker compose up -d --build || scheitern "docker compose up fehlgeschlagen"
            docker compose exec -T app python3 blog/blog_builder.py --build \
              || scheitern "blog_builder.py --build fehlgeschlagen"

            # Sitemap + robots.txt + llms.txt + Disclaimer (Host-Python, liest Git-Daten fuer lastmod)
            pip install -q Jinja2 PyYAML 2>/dev/null || pip3 install -q Jinja2 PyYAML 2>/dev/null
            python3 seo/programmatic_seo_builder.py || scheitern "programmatic_seo_builder.py fehlgeschlagen"

            # Waechter: gebaute Seiten + Sitemap gegen die erwartete URL-Liste
            python3 scripts/verify_seo_html.py || scheitern "verify_seo_html.py meldet Fehler"

            # Dekaden-Daten generieren (131 Jahre ^DJI via Stooq)
            docker compose exec -T app python3 scripts/generate_decade_data.py --ticker "^DJI" 2>/dev/null || echo "generate_decade_data.py uebersprungen"

            # Landing-Chart-Daten generieren (Split-Slider ^DJI, schreibt nach landing/data/ = host-sichtbar)
            docker compose exec -T app python3 scripts/generate_landing_chart.py 2>/dev/null || echo "generate_landing_chart.py uebersprungen"

            # nginx neu laden: restart = bewaehrt (alle frueheren Deploys),
            # picked die gemountete deploy/nginx.conf zuverlaessig auf.
            # (exec ... nginx -s reload griff hier NICHT.) Config ist
            # strukturell identisch zur zuvor laufenden -> Restart sicher.
            docker compose restart nginx

            # IndexNow: Bing/Yandex/Seznam ueber die neuen URLs informieren
            # Non-blocking: Fehler werden geloggt aber brechen den Deploy nicht
            python3 scripts/submit_indexnow.py 2>&1 | sed 's/^/  [IndexNow] /' || echo "  [IndexNow] submission failed (non-fatal)"

            # Stuendliche Jobs laufen als systemd-Timer auf dem Host (deploy/systemd/),
            # weil GitHub die stuendlichen Crons seit 2026-08-26 nur noch 4-8x/Tag startet.
            # Das Skript ist idempotent und prueft enabled/active/naechsten Termin.
            # Scheitert es, soll der Deploy rot werden — sonst liefen geaenderte
            # Units still mit dem alten Stand weiter.
            if ! bash deploy/install_timers.sh; then
              echo "::error::systemd-Timer-Installation fehlgeschlagen (deploy/install_timers.sh)"
              exit 1
            fi

            echo "Deploy done: $(date)"
