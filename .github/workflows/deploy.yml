name: Deploy to VPS

on:
  push:
    branches: [master]

# Zwei Deploys arbeiten sonst gleichzeitig im selben Serververzeichnis.
# cancel-in-progress bewusst FALSE: ein mitten im Ausrollen abgebrochener Lauf
# liesse den Server in einem halben Zustand zurueck — schlimmer als warten.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    # Commit-Nachricht BEGINNT mit „[ohne-deploy]": kein Deploy (Rückweg der Kalender-Aktivierung, docs/KALENDER_UMSTELLUNG.md
    # — ein Revert-Commit darf die gerade zurückgesicherten Ausgaben nicht neu bauen). Manueller Start bleibt möglich.
    if: ${{ !startsWith(github.event.head_commit.message, '[ohne-deploy]') }}
    runs-on: ubuntu-latest
    steps:
      # Gate VOR dem Ausrollen. Die Probe braucht nur node und die Dateien im
      # Baum — keine Cron-Ausgaben, keine Zugangsdaten. Deshalb laeuft sie hier
      # auf dem Runner und nicht in der ssh-action: node ist auf ubuntu-latest
      # vorhanden, auf dem VPS nicht nachgewiesen. Fehlt node doch, endet der
      # Schritt mit "command not found" und damit ROT — nicht still gruen
      # (derselbe Fehler steckte 2026-09-11 im Zwillings-Waechter).
      # fetch-depth: 2, weil der Cache-Waechter HEAD gegen HEAD~1 vergleicht.
      # Der Standard 1 liefert kein HEAD~1 — Codex hat nachgestellt, dass der
      # Waechter dann „kein Woerterbuch geaendert" meldete und gruen durchlief.
      # Ein Gate, das seine eigene Voraussetzung nicht hat, prueft nichts.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Waechter - Maskierung auf /polymarket
        run: node scripts/js/probe_polymarket_maskierung.js
      # Prueft deploy/pruefe_commit.sh mit einem git-Stub, also BEVOR es auf dem
      # Server laeuft. Braucht nur bash und die Standardbibliothek.
      - name: Waechter - Abschnitte und Ladegeneration auf /polymarket
        run: node scripts/js/probe_polymarket_abschnitte.js
      - name: Waechter - Discovery nimmt nichts Unpassendes an
        run: python3 scripts/verify_polymarket_discovery.py
      - name: Waechter - Zwillinge Python/JS auf /polymarket
        run: python3 scripts/verify_polymarket_zwillinge.py
      - name: Waechter - Fed-Verteilung auf /polymarket
        run: node scripts/js/probe_polymarket_fedverteilung.js
      - name: Waechter - Kalibrierungs-Aussagen auf /polymarket
        run: node scripts/js/probe_polymarket_kalibrierung.js
      - name: Waechter - Divergenz-Analyse auf /polymarket
        run: node scripts/js/probe_polymarket_divergenz.js
      # Eine Textkorrektur ohne neue Cache-Kennung erreicht den Leser nicht:
      # i18n.js legt das Woerterbuch unter sa-i18n-<_JSON_VER> ab. Ein
      # wiederkehrender Besucher las sonst weiter die alte Fassung.
      # Phase B1: die Preisqualitaet am Erzeuger. Prueft OHNE Datenbank —
      # dass die Migration gelaufen ist, kann er nicht sehen; dafuer sind
      # die Abnahmeabfragen in scripts/sql/polymarket_schema_2026_10.sql da.
      - name: Waechter - Preisqualitaet auf /polymarket
        run: python3 scripts/verify_polymarket_preisqualitaet.py
      - name: Waechter - Cache-Kennung der Woerterbuecher
        run: python3 scripts/verify_i18n_cache_version.py
      - name: Waechter - Commit-Bindung des Deploys
        run: python3 scripts/verify_deploy_commitbindung.py
      # Ab hier fest Python 3.12: numpy 1.26.4 (Waechter Handelstag-Nummern) unterstuetzt nur
      # 3.9-3.12. Bewusst NACH den uebrigen Waechtern: setup-python ersetzt python3, und dem
      # frischen Interpreter fehlt `requests` aus dem System-Python, das die Polymarket-
      # Waechter brauchen — am 2026-10-10 stand setup-python ganz oben, und der Deploy
      # scheiterte am Discovery-Waechter. Die drei Kalender-Waechter brauchen nur die
      # Standardbibliothek (und numpy).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Boersenkalender gegen woertlich belegte Sollfaelle (offen UND zu, mit Quelle).
      # Nicht aus dem Code abgeleitet: ein Zwillingsvergleich findet keinen falschen
      # Feiertag, den beide Seiten teilen (Lesson 1B). Nur Standardbibliothek.
      - name: Waechter - Boersenkalender gegen belegte Sollfaelle
        run: python3 scripts/verify_kalender_sollfaelle.py
      # Eine Ticker-Zuordnung, keine stillen NYSE-Ersatzkalender (Bestand: 370 Zuordnungen
      # eingefroren in scripts/fixtures/). Nur Standardbibliothek.
      - name: Waechter - Ticker-Zuordnung und strenge Boersenpruefung
        run: python3 scripts/verify_ticker_boerse.py
      # Unabhaengige Zaehlung mit numpy.busday_count — numpy fehlt auf dem Runner,
      # deshalb fest installiert. Scheitert die Installation, ist der Schritt ROT.
      - name: Waechter - Handelstag-Nummern nach Boersenkalender
        run: |
          python3 -m pip install --quiet numpy==1.26.4
          python3 scripts/verify_handelstag_nummern.py
      # Der JS-Boersenkalender (Plan v6, Weg A) ist erzeugt: erst pruefen, dass die committete
      # Datei der Neuerzeugung aus Python entspricht (Arbeitsbaum UND HEAD), dann die echte
      # Datei in node unter sechs Zeitzonen gegen Python/numpy. Keine Seite bindet sie bisher ein.
      - name: Waechter - JS-Boersenkalender aktuell und gleich Python
        run: |
          python3 scripts/build_boersenkalender_js.py --pruefen
          python3 scripts/verify_boersenkalender_js.py
      # V1c-1 Ereigniskatalog (shared/boersenereignisse.py, Vertrag B4): eingefrorener Bestand, Invarianten,
      # handgeschriebene Sollfaelle mit Quelle, Versionsvertrag a-d und vollstaendige Objektgleichheit Python = JS.
      # Tabellenidentitaeten (HKEX/KRX 2016-2026) werden als Abnahmeluecke ausgegeben. Nur Standardbibliothek + node.
      - name: Waechter - Ereigniskatalog der Boersenschliessungen
        run: python3 scripts/verify_boersenereignisse.py
      # V1c-2 US-Produkttermine (shared/produkttermine.py): Belege (Cboe-Dateien/Jahreskalender) = Regel,
      # Sollfaelle, Einstufung mit festem Pruefdatum, synthetische Kalender, Python = JS. Abdeckungsluecken
      # werden ausgegeben. Nur Standardbibliothek + node.
      - name: Waechter - US-Produkttermine OPEX und VIX
        run: python3 scripts/verify_produkttermine.py
      # V1d Sitzungshelfer (shared/sitzungen.py = SA.boersenkalender): unabhaengige numpy-Referenz fuer jeden Tag
      # 1885-2100 an 13 Boersen, Rand-/Eingabe-/Zeitzonenfaelle, Python = JS in drei Prozesszonen. numpy ist aus
      # dem Schritt "Handelstag-Nummern" installiert.
      - name: Waechter - Sitzungshelfer
        run: python3 scripts/verify_sitzungen.py

      # Daily Briefing auf dem systemd-Timer (2026-10-12): ein Live-Versand je Berliner Datum, Wiederaufnahme ohne
      # Doppelte, Health-Check nur Live-Laeufe + 10:00-Frist, kein GitHub-Zeitplan. --streng: unter Linux muss auch
      # der parallele Lauf (flock) gepruefte sein, UNGEPRUEFT ist rot.
      # requests: der Wächter prüft den echten Mailadapter (shared/email_brevo, nur requests.post ersetzt); dem
      # Interpreter von setup-python fehlt das Paket (siehe Kommentar oben).
      - name: Waechter - Briefing-Versand
        run: |
          python3 -m pip install --quiet requests==2.32.3
          python3 scripts/verify_briefing_versand.py --streng
      # P2: jeder Schreiber von prices.tdom/tdoy schreibt Kalendernummern — die echten Schreibwege offline
      # mit Stubs fuer Supabase/Yahoo, gegen eine unabhaengige numpy-Zaehlung. Braucht pandas.
      - name: Waechter - Schreiber von TDOM/TDOY nach Boersenkalender
        run: |
          python3 -m pip install --quiet pandas==2.2.3 tzdata
          python3 scripts/verify_schreiber_nummern.py
      # Renditen aus gespeicherten Tagesreturns statt aus Schlusskursen (ETHA-Basiswechsel 2026-09-30), Health-Check
      # „Kursbasis“, Morgen-Mail ohne Earnings mit Dividenden. Echte Funktionen, nur Lader/Supabase als Attrappe.
      # Braucht pandas (Schritt davor) und requests.
      - name: Waechter - Kursbasis und realisierte Vola
        run: |
          python3 -m pip install --quiet requests==2.32.3
          python3 scripts/verify_basisabweichung.py
      # Morgen-Mail: Kursreihe beginnt hinter dem juengsten Widerspruch zwischen Kursen und log_return (Basiswechsel
      # oder falscher Return, nichts wird umgerechnet), Seitenabfrage mit Gesamtordnung (nur nach Datum liefen an den
      # Seitengrenzen Zeilen doppelt bzw. fehlten). Supabase als Attrappe.
      - name: Waechter - basisgleiche Kursreihe der Mail
        run: python3 scripts/verify_kursreihe_basis.py
      # Skew-History: gemeinsame Schreibsperre aller Schreiber (Cron, Massive-Backfill, VRP), defekte History bricht
      # ab statt sie zu ueberschreiben, Reparaturmodus nur gegen eine Freigabedatei. --streng: unter Linux muss die
      # Parallelitaetsprobe laufen, UNGEPRUEFT ist rot.
      - name: Waechter - Schreibsperre der Skew-History
        run: python3 scripts/verify_skew_historie_sperre.py --streng
      # GEX/Key Levels/IV-Surface: Session als Stempel UND Bewertungsdatum, EOD-Schutz vor dem ersten Abruf, Key Levels
      # nur mit GEX derselben Session, Health-Frische in Sessions. Netz/Uhr als Attrappe.
      # Radar-Quadranten (/skew, /flows, Blog): oben die teure Skew-Seite verkaufen, unten die guenstige kaufen.
      - name: Waechter - Radar-Quadranten
        run: python3 scripts/verify_radar_quadranten.py
      # Skew-Rang einmal im Cron (shared/skew_rang.py = scripts/js/skew_rang_ref.js), /skew und Mail lesen ihn.
      - name: Waechter - Skew-Rang im Cron
        run: python3 scripts/verify_skew_rang.py
      # Kursmuster Smash Day in der Morgen-Mail (shared/kursmuster.py): Regel/Gueltigkeit = Ereignisstudie
      # (Zwillingsvergleich), Session- und Lueckenpruefung, Vorlage gruen/rot.
      - name: Waechter - Kursmuster Smash Day
        run: |
          python3 -m pip install --quiet "jinja2>=3.1.0"
          python3 scripts/verify_kursmuster.py
      # Sektor-Rotation der Morgen-Mail (Nutzerbefund 2026-10-20): keine erfundene
      # Ersatztabelle, laufender Monat zaehlt nicht mit, Fallzahl an jeder Zahl,
      # Vorzeichen und Farbe in der Vorlage. Rendert die echte Vorlage.
      - name: Waechter - Sektor-Rotation in der Mail
        run: |
          python3 -m pip install --quiet "jinja2>=3.1.0" "pandas>=2.0"
          python3 scripts/verify_sektor_rotation.py
      # Polymarket B2: Marktstatus-Lebenszyklus (Entwurf in 4 Codex-Runden bis
      # Freigabe, docs/review_prompts/2026-10-20_polymarket_b2_entwurf_v4.md).
      # Die Supabase-Attrappe stellt die GEMESSENE Filtersemantik nach, inklusive
      # SQL-NULL: ein blosses `neq` trifft eine Zeile mit status IS NULL nicht.
      # PyYAML: der Waechter LIEST den Shellblock aus polymarket_daily.yml und fuehrt
      # ihn mit Attrappen aus, statt ihn nachzubauen. Ohne das Paket ist dieser
      # Nachweis ungeprueft, und ungepruefte Nachweise gelten nie als bestanden —
      # der erste Gate-Lauf scheiterte genau daran.
      - name: Waechter - Polymarket Marktstatus
        run: |
          python3 -m pip install --quiet PyYAML
          python3 scripts/verify_polymarket_status.py
      # Events-Sektion der Morgen-Mail: VIXpiration kommt aus dem belegten
      # Produkttermin-Katalog (Nutzerentscheidung 2026-10-20), mit Feiertagsregel,
      # Fenstergrenzen und Erkenntnisgrenze ab Kontraktmonat 2015-09.
      - name: Waechter - Events in der Morgen-Mail
        run: python3 scripts/verify_mail_events.py
      # Vorbedingung von Kalender V3: die OPEX-Momentaufnahme darf sich nicht still
      # aendern. 2 592 Monate, alle Rueckgabefelder von get_opex_date,
      # get_all_opex_dates und populate_opex, dazu zwoelf Stichproben im Volltext —
      # damit eine Abweichung lesbar ist und nicht nur "Hash ungleich".
      - name: Waechter - OPEX-Momentaufnahme (Vorbedingung V3)
        run: python3 scripts/opex_momentaufnahme.py --pruefen
      # scipy: die GEX-Engine (compute_gamma_exposure) importiert scipy.stats; Version wie im App-Container.
      - name: Waechter - Session der Options-Erzeuger
        run: |
          python3 -m pip install --quiet scipy==1.18.1
          python3 scripts/verify_gex_session.py
      # Kurslader SA.kurse (docs/TICKER_LADEN.md, S1): die echte landing/js/kurse.js in node gegen einen
      # PostgREST-Nachbau, jeder Abschnitt in eigenem Prozess. Verlangt Exit 0 und Endmarker je Abschnitt.
      - name: Waechter - Kurslader SA.kurse
        run: python3 scripts/verify_kurse.py
      # Produktionssperre (docs/KALENDER_UMSTELLUNG.md V1a): Inventar aller Schreiber, Einbau in jedem Pflicht-Skript,
      # Verhalten mit/ohne Aktivierungsmarke und exklusivem Lock (streng: fcntl auf Linux Pflicht).
      - name: Waechter - Produktionssperre
        run: SA_SPERRE_STRENG=1 python3 scripts/verify_produktionssperre.py
      # Seitenprobe: die echte Seite in jsdom (feste Version scripts/perf/package-lock.json), vorher/nachher gleiche
      # Anzeige und Chart-Serien — normal, gescheiterte Vollhistorie, TTL-Ablauf mit Fehler.
      - name: Waechter - Seitenprobe Kurslader (Anzeige vorher = nachher)
        run: |
          npm ci --prefix scripts/perf --no-audit --no-fund
          python3 scripts/verify_seiten_kurse.py
      # /spot-vol-beta (Plan docs/review_prompts/2026-10-19_spot_vol_beta_plan_v3.md): echter Rechenkern
      # landing/js/spot-vol-compute.js mit Börsenkalender gegen eine unabhängige numpy-Referenz (Sitzungsachse,
      # Lücken, Rolling, Stress-Schwelle, Ereignisse, Residuum, VRP = shared.realized_vol, Frische, drei Zeitzonen).
      - name: Waechter - Spot-Vol Beta
        run: python3 scripts/verify_spot_vol_beta.py
      # GEX-Spot und Kettenvertrag (docs/review_prompts/2026-10-21_gex_abendluecke_entwurf_v5.md):
      # Yahoo liefert den Tagesbalken der Session etwa 00:00-01:10 UTC mit close = null, der
      # verspaetete GitHub-Cron traf das fuenf Naechte in Folge. Geprueft werden der Rueckfall auf
      # Massive /prev (nur bei fehlendem Kurs, mit Datumspruefung), die Handelstagpruefung und der
      # Statusvertrag der Huelle (Key Levels nur bei "veroeffentlicht").
      - name: Waechter - GEX-Spot und Kettenvertrag
        run: python3 scripts/verify_gex_spot.py
      # Kalender V2 (docs/review_prompts/2026-10-18_kalender_v2_*): Fassade SA.holidays, Header, Converter — braucht
      # jsdom aus dem npm ci darüber (echte Seiten, alt gegen HEAD).
      - name: Waechter - Kalender-Fassade, Header und Converter (V2)
        run: python3 scripts/verify_holidays_fassade.py
      # Tabellen-Sortierung (jsdom, braucht das npm ci darüber): SA.makeSortable laesst die Kopfzeile oben, auch im
      # impliziten <tbody>; /skew Vol-Kennzahlen sortiert beide Haelften gemeinsam (2026-10-17).
      - name: Waechter - Tabellen-Sortierung
        run: node scripts/js/probe_sortierer.js
      # True Seasonal auf /jahreszyklus (Plan docs/review_prompts/2026-10-16_true_seasonal_plan_v3.md): Standard wie
      # bisher, gemerkter Modus „true" mit goldener Linie, Rueckblick laedt erst beim Aufklappen, Tickerwechsel und
      # Ladefehler. Die Rechnung selbst prueft der naechste Schritt.
      - name: Waechter - True Seasonal Seite
        run: python3 scripts/verify_true_seasonal_seite.py
      # Rechnung: echter JS-Kern + Seiten-Builder gegen shared/true_seasonal.py und fachliche Sollwerte (Heuristik
      # „vollstaendig", Kalenderfenster, Zieljahr-Unabhaengigkeit mit Ausreisserfilter, Mindestmenge nach dem Filter).
      - name: Waechter - True Seasonal Rechnung
        run: |
          python3 -m pip install --quiet plotly==7.1.0
          python3 scripts/verify_seasonal_twins.py --nur-true-seasonal
      # Releasekennung + Kalendermethode (V1b, docs/KALENDER_UMSTELLUNG.md): Einbindung aller Seiten und Dateien,
      # Deploy-/nginx-Regeln, Simulation von deploy/release_setzen.py (ersetzt das Isolations-Gate C P3a).
      - name: Waechter - Einbindung Releasekennung
        run: python3 scripts/verify_einbindung.py
      # Release-Sperre: Transport (kurse.js, SA.supabase) und echte Seite in jsdom, je Fall mit positiver Kontrolle.
      - name: Waechter - Release-Sperre
        run: python3 scripts/verify_release_sperre.py

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          SA_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SA_SHA
          # Standard waeren 10 min — zu kurz, seit der Container-Austausch bis zu 45 min auf laufende
          # Pflicht-Laeufe wartet (flock unten).
          command_timeout: 75m
          script: |
            cd /opt/seasonaledge

            # Holen zuerst: das veraendert den Arbeitsbaum NICHT, bringt aber die
            # Objekte des geprueften Commits auf den Server.
            : "${SA_SHA?Uebertragung fehlgeschlagen: SA_SHA fehlt}"
            if ! git fetch origin master; then
              echo "::error::git fetch fehlgeschlagen — Arbeitsbaum unveraendert."
              exit 1
            fi

            # Die Bindung laeuft aus der GEPRUEFTEN Fassung des Skripts, gezogen
            # aus dem geholten Commit — nicht aus dem Arbeitsbaum des Servers.
            # Zwei Gruende, beide von Codex gefunden: beim ersten Lauf liegt die
            # Datei im Arbeitsbaum noch nicht (der Deploy haette sich selbst
            # blockiert), und danach liefe die Server-Fassung, waehrend das Gate
            # auf dem Runner die neue geprueft hat.
            # Exklusiv angelegtes privates Verzeichnis, KEIN vorhersagbarer Pfad.
            # Der Server wird mit einem zweiten Projekt geteilt; eine feste Datei
            # wie /tmp/sa_pruefe_commit.sh koennte ein lokaler Nutzer vorher als
            # Symlink anlegen oder zwischen Schreiben und Ausfuehren austauschen —
            # und ausgefuehrt wird hier als root (Codex-Befund, Runde 5).
            SA_TMP=$(mktemp -d) || { echo "::error::mktemp -d fehlgeschlagen."; exit 1; }
            chmod 700 "$SA_TMP"
            trap 'rm -rf "$SA_TMP"' EXIT
            if ! git show "$SA_SHA:deploy/pruefe_commit.sh" > "$SA_TMP/pruefe_commit.sh"; then
              echo "::error::Geprueefte Fassung von deploy/pruefe_commit.sh nicht"
              echo "aus $SA_SHA lesbar — Abbruch, nichts veraendert."
              exit 1
            fi
            # Erst NUR vergleichen: bricht dieser Schritt ab, ist der
            # Arbeitsbaum unangetastet und die live gebundene Seite liefert
            # weiter den alten, funktionierenden Stand. Vorher liefen die
            # Reverts davor — ein Abbruch hinterliess landing/ mit
            # Credential-Platzhaltern (Codex, Abnahme 2026-10-08).
            if ! bash "$SA_TMP/pruefe_commit.sh" --nur-vergleich; then
              echo "::error::Commit-Bindung fehlgeschlagen — nichts veraendert."
              exit 1
            fi

            # Releasekennung (V1b): ab dem ersten Eingriff in landing/ stellt die EXIT-Falle in JEDEM Fall gleiche
            # Kennungen her — auch wenn das Vorspulen scheitert oder die erste Normalisierung. Die Kennung wird erst
            # beim Ausloesen bestimmt (HEAD dann: neuer Commit nach dem Vorspulen, sonst der alte); fehlt
            # release_setzen.py in diesem Stand (vor V1b), gibt es keine Kennungen und nichts zu tun.
            release_falle() {
              if [ -f deploy/release_setzen.py ]; then
                python3 deploy/release_setzen.py "$(git rev-parse HEAD)" >/dev/null 2>&1 \
                  || echo "::error::release_setzen im Fehlerweg gescheitert — Seiten pruefen!"
              fi
              rm -rf "$SA_TMP"
            }
            trap release_falle EXIT

            # Jetzt die Reverts: inject_credentials.sh aendert landing/
            # in-place, und diese Aenderungen blockieren sonst das Vorspulen.
            git checkout -- seo/output/ 2>/dev/null || true
            # seo/tools/ traegt seit Kalender V2 Releasekennung + Cache-Buster (Converter) — beides In-Place.
            git checkout -- seo/tools/ 2>/dev/null || true
            git checkout -- landing/ 2>/dev/null || true

            # Ab hier ist der Baum angefasst. Scheitert das Vorspulen, traegt
            # landing/ die Platzhalter aus dem Commit — deshalb wird die
            # Auslieferbarkeit vor dem Abbruch wiederhergestellt.
            if ! bash "$SA_TMP/pruefe_commit.sh"; then
              echo "::error::Commit-Bindung fehlgeschlagen — Auslieferbarkeit" \
                   "wird wiederhergestellt, nichts Neues ausgerollt."
              bash deploy/inject_credentials.sh /opt/seasonaledge || \
                echo "::error::Wiederherstellung fehlgeschlagen — Seite pruefen!"
              exit 1
            fi

            # Releasekennung (V1b, landing/js/methode.js): EINE Quelle fuer den ganzen Deploy — der volle Hash des
            # gerade vorgespulten Commits. Sofort danach alte Ausgaben (landing/en/, blog/output/) auf den Platzhalter
            # normalisieren: die frisch gezogenen Skripte tragen ihn, sonst sperrte jede alte Seite im Deploy-Fenster.
            # Scheitert ab hier etwas, setzt die EXIT-Falle (oben) alle Kennungen auf diesen Commit.
            RELEASE=$(git rev-parse HEAD) || { echo "::error::Releasekennung nicht bestimmbar"; exit 1; }
            python3 deploy/release_setzen.py '%%RELEASE%%' \
              || { echo "::error::release_setzen (Normalisieren) fehlgeschlagen"; exit 1; }

            # Supabase Credentials in Landing-HTML injizieren (Cache-Buster = Releasekennung)
            bash deploy/inject_credentials.sh /opt/seasonaledge "$RELEASE"

            # Reihenfolge und Abbrueche (SEO-Review 2026-09-30): erst ALLE Seiten
            # bauen, dann die Sitemap daraus erzeugen, dann pruefen. Jeder dieser
            # Schritte bricht den Deploy ab — frueher waren EN-Build und
            # Blog-Build "non-fatal", ein spaeter erfolgreicher Befehl verdeckte
            # den Fehlschlag, und die Sitemap entstand vor dem Blog.
            # (Der fruehere nginx-Laufzeitfallback @en_runtime existiert nicht mehr.)
            scheitern() { echo "::error::$1"; exit 1; }

            # EN-Landing-Pages vorrendern -> landing/en/<slug>.html (statisch).
            # Laeuft NACH inject_credentials, damit die EN-Pages Credentials +
            # Cache-Bust erben.
            python3 landing/build_en.py --write || scheitern "build_en.py fehlgeschlagen"

            # Docker rebuild + restart, dann Blog (DE+EN) im Container bauen.
            # Erst bauen (der laufende Container bleibt unberuehrt), dann den Austausch erst, wenn kein Pflicht-Lauf
            # der Produktionssperre mehr laeuft: exklusiver flock auf dieselbe Sperrdatei, die jeder Pflicht-Lauf
            # (Nightly, Intraday, Daily Briefing, ...) geteilt haelt (shared/produktionssperre.py). Sonst beendet der
            # Neubau einen laufenden docker-exec-Job per SIGKILL (Brier 11.10.2026). Obergrenze 45 min, danach rot.
            # Nicht erfasst: Laeufe ausserhalb des Pflicht-Inventars (z. B. Brier-Scraper) — dort gilt weiter:
            # nicht pushen, waehrend sie laufen.
            docker compose build || scheitern "docker compose build fehlgeschlagen"
            mkdir -p logs/sperre
            flock -x -w 2700 logs/sperre/produktion.lock docker compose up -d \
              || scheitern "docker compose up fehlgeschlagen oder Pflicht-Lauf nach 45 min nicht beendet"
            docker compose exec -T app python3 blog/blog_builder.py --build \
              || scheitern "blog_builder.py --build fehlgeschlagen"

            # Sitemap + robots.txt + llms.txt + Disclaimer (Host-Python, liest Git-Daten fuer lastmod)
            pip install -q Jinja2 PyYAML 2>/dev/null || pip3 install -q Jinja2 PyYAML 2>/dev/null
            python3 seo/programmatic_seo_builder.py || scheitern "programmatic_seo_builder.py fehlgeschlagen"

            # Releasekennung als LETZTER Schritt aller HTML-Erzeuger (Injection, EN, Blog, SEO): jede Seite und jede
            # eigene JS-Datei bekommt dieselbe Kennung; die Abschlusspruefung bricht den Deploy bei jeder Abweichung ab.
            python3 deploy/release_setzen.py "$RELEASE" || scheitern "release_setzen meldet abweichende Kennungen"

            # Waechter: gebaute Seiten + Sitemap gegen die erwartete URL-Liste
            python3 scripts/verify_seo_html.py || scheitern "verify_seo_html.py meldet Fehler"

            # Dekaden-Daten generieren (131 Jahre ^DJI via Stooq)
            docker compose exec -T app python3 scripts/generate_decade_data.py --ticker "^DJI" 2>/dev/null || echo "generate_decade_data.py uebersprungen"

            # Landing-Chart-Daten generieren (Split-Slider ^DJI, schreibt nach landing/data/ = host-sichtbar)
            docker compose exec -T app python3 scripts/generate_landing_chart.py 2>/dev/null || echo "generate_landing_chart.py uebersprungen"

            # nginx neu laden: restart = bewaehrt (alle frueheren Deploys),
            # picked die gemountete deploy/nginx.conf zuverlaessig auf.
            # (exec ... nginx -s reload griff hier NICHT.) Config ist
            # strukturell identisch zur zuvor laufenden -> Restart sicher.
            docker compose restart nginx

            # IndexNow: Bing/Yandex/Seznam ueber die neuen URLs informieren
            # Non-blocking: Fehler werden geloggt aber brechen den Deploy nicht
            python3 scripts/submit_indexnow.py 2>&1 | sed 's/^/  [IndexNow] /' || echo "  [IndexNow] submission failed (non-fatal)"

            # Stuendliche Jobs laufen als systemd-Timer auf dem Host (deploy/systemd/),
            # weil GitHub die stuendlichen Crons seit 2026-08-26 nur noch 4-8x/Tag startet.
            # Das Skript ist idempotent und prueft enabled/active/naechsten Termin.
            # Scheitert es, soll der Deploy rot werden — sonst liefen geaenderte
            # Units still mit dem alten Stand weiter.
            if ! bash deploy/install_timers.sh; then
              echo "::error::systemd-Timer-Installation fehlgeschlagen (deploy/install_timers.sh)"
              exit 1
            fi

            echo "Deploy done: $(date)"
