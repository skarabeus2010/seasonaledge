name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/seasonaledge
            git checkout -- seo/output/ 2>/dev/null || true
            git checkout -- landing/ 2>/dev/null || true

            # Der Pull MUSS den Job fehlschlagen lassen, wenn er abbricht. Ohne das
            # meldet der Deploy "success", waehrend der Server auf dem alten Commit
            # stehen bleibt — die neue Seite/der Fix fehlt lautlos.
            # Passiert am 2026-09-17: scripts/skewfix_status.sh hatte auf dem Server
            # ein abweichendes Mode-Bit (chmod +x von Hand), der zugehoerige Commit
            # setzte dasselbe Bit in git -> "local changes would be overwritten,
            # Aborting". Der Revert oben deckt nur landing/ und seo/output/ ab;
            # alles ausserhalb blockiert den Pull.
            # Frueherer Fall derselben Klasse: uncommittete nginx.conf (CLAUDE.md).
            if ! git pull origin master; then
              echo "::error::git pull abgebrochen — Server bleibt auf $(git rev-parse --short HEAD)."
              echo "Blockierende Dateien ausserhalb von landing/ und seo/output/:"
              git status --porcelain | grep -v '^??' | grep -vE ' (landing|seo/output)/' || true
              echo "Aufloesen: auf dem Server pruefen (git diff <datei>), dann"
              echo "  git checkout -- <datei>   (nur wenn die Aenderung verzichtbar ist)"
              exit 1
            fi

            # Supabase Credentials in Landing-HTML injizieren
            bash deploy/inject_credentials.sh /opt/seasonaledge

            # EN-Landing-Pages vorrendern -> landing/en/<slug>.html (statisch).
            # Laeuft NACH inject_credentials, damit die EN-Pages Credentials +
            # Cache-Bust erben. Non-fatal: nginx faellt sonst auf den
            # Laufzeit-sub_filter-Swap zurueck (@en_runtime).
            python3 landing/build_en.py --write || echo "  [build_en] fehlgeschlagen (non-fatal)"

            # SEO + Blog generieren
            pip install -q Jinja2 PyYAML 2>/dev/null || pip3 install -q Jinja2 PyYAML 2>/dev/null
            python3 seo/programmatic_seo_builder.py

            # Docker rebuild + restart
            docker compose up -d --build
            docker compose exec -T app python3 blog/blog_builder.py --build

            # Dekaden-Daten generieren (131 Jahre ^DJI via Stooq)
            docker compose exec -T app python3 scripts/generate_decade_data.py --ticker "^DJI" 2>/dev/null || echo "generate_decade_data.py uebersprungen"

            # Landing-Chart-Daten generieren (Split-Slider ^DJI, schreibt nach landing/data/ = host-sichtbar)
            docker compose exec -T app python3 scripts/generate_landing_chart.py 2>/dev/null || echo "generate_landing_chart.py uebersprungen"

            # nginx neu laden: restart = bewaehrt (alle frueheren Deploys),
            # picked die gemountete deploy/nginx.conf zuverlaessig auf.
            # (exec ... nginx -s reload griff hier NICHT.) Config ist
            # strukturell identisch zur zuvor laufenden -> Restart sicher.
            docker compose restart nginx

            # IndexNow: Bing/Yandex/Seznam ueber die neuen URLs informieren
            # Non-blocking: Fehler werden geloggt aber brechen den Deploy nicht
            python3 scripts/submit_indexnow.py 2>&1 | sed 's/^/  [IndexNow] /' || echo "  [IndexNow] submission failed (non-fatal)"

            echo "Deploy done: $(date)"
