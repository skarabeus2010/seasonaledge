name: Congress Trades Alert

on:
  schedule:
    - cron: '0 */3 * * *'     # alle 3h — neue PTR-Filings prüfen + Sofort-Alert (inkrementell)
  workflow_dispatch:
    inputs:
      seed_only:
        description: "Nur State seeden (keine Alerts)"
        required: false
        default: false
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Congress trades run via VPS
        uses: appleboy/ssh-action@v1
        env:
          SA_EVENT: ${{ github.event_name }}
          SA_SEED:  ${{ github.event.inputs.seed_only }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 18m
          envs: SA_EVENT,SA_SEED
          script: |
            # pipefail: ohne ihn liefert `docker exec … | tail -60` den Status von
            # tail (immer 0), und der abschliessende echo setzt danach den
            # Exit-Code des Skripts — ein gescheiterter Lauf waere doppelt
            # unsichtbar. Genau das macht einen stillen Ausfall moeglich: der
            # Job meldet gruen, waehrend seit Tagen kein Filing mehr geprueft
            # wird, und auffallen wuerde es erst an der Mail, die NICHT kommt.
            set -uo pipefail
            # FAIL-CLOSED: eine nicht angekommene Eingabe darf nicht in den
            # Standard fallen. Auf dem Zeitplan sind die Variablen gesetzt und
            # LEER, bei Transportfehler UNGESETZT — ${VAR?} unterscheidet das.
            : "${SA_EVENT?Uebertragung fehlgeschlagen: SA_EVENT fehlt}"
            : "${SA_SEED?Uebertragung fehlgeschlagen: SA_SEED fehlt}"
            if [ "$SA_EVENT" = "workflow_dispatch" ]; then
              case "$SA_SEED" in
                true|false) ;;
                *) echo "[congress-trades] FEHLER: seed_only ist '$SA_SEED'"; exit 1 ;;
              esac
            fi
            args=(--run)
            if [ "$SA_SEED" = "true" ]; then args=(--seed-only); fi
            echo "[congress-trades] event=$SA_EVENT args=${args[*]}"
            docker exec seasonalpha-app python3 scripts/congress_trades.py "${args[@]}" 2>&1 | tail -60
            rc=${PIPESTATUS[0]}
            echo "[congress-trades] Done: $(date) rc=$rc"
            exit $rc
