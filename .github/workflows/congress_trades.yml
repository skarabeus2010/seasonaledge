name: Congress Trades Alert

on:
  schedule:
    - cron: '0 */3 * * *'     # alle 3h — neue PTR-Filings prüfen + Sofort-Alert (inkrementell)
  workflow_dispatch:
    inputs:
      seed_only:
        description: "Nur State seeden (keine Alerts)"
        required: false
        default: false
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Congress trades run via VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 18m
          script: |
            # pipefail: ohne ihn liefert `docker exec … | tail -60` den Status von
            # tail (immer 0), und der abschliessende echo setzt danach den
            # Exit-Code des Skripts — ein gescheiterter Lauf waere doppelt
            # unsichtbar. Genau das macht einen stillen Ausfall moeglich: der
            # Job meldet gruen, waehrend seit Tagen kein Filing mehr geprueft
            # wird, und auffallen wuerde es erst an der Mail, die NICHT kommt.
            set -uo pipefail
            SEED="${{ github.event.inputs.seed_only }}"
            ARGS="--run"
            if [ "$SEED" = "true" ]; then ARGS="--seed-only"; fi
            echo "[congress-trades] args:$ARGS"
            docker exec seasonalpha-app python3 scripts/congress_trades.py $ARGS 2>&1 | tail -60
            rc=${PIPESTATUS[0]}
            echo "[congress-trades] Done: $(date) rc=$rc"
            exit $rc
