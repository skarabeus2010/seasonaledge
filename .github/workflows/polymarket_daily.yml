name: Polymarket Daily Refresh

# Taeglicher Polymarket-Snapshot — der EINZIGE automatische Ausloeser dafuer.
# Frueher zusaetzlich nightly_refresh.py Phase G; die scheiterte dort jeden Tag,
# weil ein st.secrets-Zugriff eine veraltete SUPABASE_URL aus .streamlit/secrets.toml
# in die Umgebung kopierte und die Kind-Prozesse sie erbten (Ursache gefunden
# 2026-09-29, Phase G danach entfernt, damit nichts doppelt laeuft).
#
# Montags zusaetzlich Backfill fuer volle Historie aller 26 Markets.

on:
  schedule:
    # 21:30 UTC taeglich — NACH US-Close (20:00 UTC) + NACH dem Nightly-Peak,
    # damit der Container nicht gleichzeitig unter Last steht.
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      include_backfill:
        description: "Zusaetzlich Backfill laufen lassen (volle Historie)"
        required: false
        default: false
        type: boolean

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Polymarket daily snapshot
        uses: appleboy/ssh-action@v1
        env:
          SA_EVENT:    ${{ github.event_name }}
          SA_BACKFILL: ${{ github.event.inputs.include_backfill }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m
          envs: SA_EVENT,SA_BACKFILL
          script: |
            set -uo pipefail
            # FAIL-CLOSED: eine nicht angekommene Eingabe darf nicht in den
            # Standard fallen. Auf dem Zeitplan sind die Variablen gesetzt und
            # LEER, bei Transportfehler UNGESETZT — ${VAR?} unterscheidet das.
            #
            # Die Prüfung steht VOR Schritt 1. Mein erster Entwurf hatte sie erst
            # beim Backfill-Zweig — dann wäre Schritt 1 schon gelaufen, bevor der
            # Abbruch greift, und „fail-closed" wäre nur halb wahr. Der Testfall
            # hat genau das gemeldet.
            : "${SA_EVENT?Uebertragung fehlgeschlagen: SA_EVENT fehlt}"
            : "${SA_BACKFILL?Uebertragung fehlgeschlagen: SA_BACKFILL fehlt}"
            if [ "$SA_EVENT" = "workflow_dispatch" ]; then
              case "$SA_BACKFILL" in
                true|false) ;;
                *) echo "[polymarket-daily] FEHLER: include_backfill ist" \
                        "'$SA_BACKFILL', erwartet true oder false"; exit 1 ;;
              esac
            fi

            echo "[polymarket-daily] Step 1/2: snapshot (26 markets)"
            docker exec seasonalpha-app python3 scripts/polymarket_refresh.py 2>&1 | tail -30

            # Montags ODER workflow_dispatch mit include_backfill=true: Backfill
            DOW=$(date -u +%u)  # 1 = Montag, 7 = Sonntag
            if [ "$DOW" = "1" ] || [ "$SA_BACKFILL" = "true" ]; then
              echo "[polymarket-daily] Step 2/2: backfill (volle Historie)"
              docker exec seasonalpha-app python3 scripts/polymarket_backfill.py 2>&1 | tail -20
            else
              echo "[polymarket-daily] Step 2/2: skip backfill (nicht Montag)"
            fi

            echo "[polymarket-daily] Done: $(date)"
