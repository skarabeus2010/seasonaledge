name: GEX Snapshot (Dealer Positioning)

# KEIN Zeitplan mehr. Der regulaere Lauf ist sa-gex-snapshot.timer auf dem VPS
# (deploy/systemd/, installiert von deploy/install_timers.sh im Deploy).
#
# WARUM: GitHub startete den Cron `15 22 * * 1-5` zwischen 2 und 5 Stunden verspaetet und
# traf damit seit dem 15.10.2026 fuenf Naechte in Folge das Yahoo-Loch — zwischen etwa
# 00:00 und 01:10 UTC liefert Yahoo den Tagesbalken der Session mit `close = null`
# (gemessen, Proben /root/yahoo_abend). Jeder Ticker fiel aus, der Lauf endete nach 13 s
# mit Exit 1. Ein `schedule`-Eintrag hier wuerde den Lauf zusaetzlich zum Timer starten
# (Doppellauf) — deshalb bleibt er weg.
#
# Dieser Workflow ist nur noch der NOTAUSLOESER und startet dieselbe Unit. Er nutzt
# ausdruecklich `--reparatur`: ein manuell ausgeloester Nachholauf soll auch an einem
# Boersenfeiertag laufen, waehrend der automatische Lauf dort uebersprungen wird.

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: GEX-Kette auf dem VPS (Reparaturlauf)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 32m
          script: |
            # pipefail ist Pflicht: ohne ihn liefert `docker exec … | tail` den Status von
            # tail (immer 0). Deshalb den Exit-Code VOR der Pipe sichern.
            set -uo pipefail
            # Die Huelle scripts/gex_kette.py entscheidet aus Exit-Code UND Ergebnismarker,
            # ob compute_key_levels startet — ein Trockenlauf oder ein uebersprungener Lauf
            # darf den schreibenden Folgeschritt nicht ausloesen.
            docker exec seasonalpha-app timeout --kill-after=30s 22m \
              python3 -u scripts/gex_kette.py --reparatur 2>&1 | tail -40
            rc=${PIPESTATUS[0]}
            echo "GEX-Kette beendet mit Exit $rc: $(date)"
            # Exit 75 = Produktionssperre (Kalender-Aktivierung): geplant unterdrueckt,
            # kein Fehler. Jeder andere Exit bleibt ein Fehler.
            if [ "$rc" -eq 75 ]; then
              echo "Produktionssperre aktiv — Lauf geplant unterdrueckt (Exit 75 -> Erfolg)"
              exit 0
            fi
            exit $rc
