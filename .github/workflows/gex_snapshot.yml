name: GEX Snapshot (Dealer Positioning)

on:
  schedule:
    # 22:15 UTC (Mo-Fr) — nach US-Boersenschluss (21:00 UTC). Erfasst den Tages-Chain-Stand
    # (Spot + IV); OI ist OCC-Settlement des Vortags. Fuettert /dealer-positioning + baut
    # taeglich die proprietaere GEX-Historie (landing/data/gex_history/<date>.json) auf.
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 20 statt 12 Min: die Chart-Ticker bekommen seit dem Term-Struktur-Fix einen zweiten
    # Durchlauf ueber die volle Chain (PROFILE_MAX_DAYS), das kostet ~1 Min zusaetzlich.
    timeout-minutes: 20
    steps:
      - name: GEX snapshot on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 18m
          script: |
            # pipefail ist Pflicht: ohne ihn liefert `docker exec … | tail -30` den
            # Status von tail (immer 0). Zweite Falle: der abschliessende echo setzt
            # den Exit-Code des Skripts — deshalb am Ende explizit `exit $fail`.
            set -uo pipefail
            fail=0
            docker exec seasonalpha-app python3 scripts/snapshot_gex_massive.py 2>&1 | tail -30 \
              || { echo "FEHLER: snapshot_gex_massive (Exit ${PIPESTATUS[0]})"; fail=1; }
            echo "GEX snapshot done: $(date)"

            # Key Levels & Max Pain braucht die frische gex_summary.json (Spot/Flip/Walls).
            # Bei gescheitertem Snapshot wuerde es auf ALTEN Daten rechnen und die Seite
            # zeigte gestrige Levels als heutige — deshalb hier abbrechen statt fortfahren.
            if [ "$fail" -ne 0 ]; then
              echo "UEBERSPRUNGEN: compute_key_levels (haette auf veralteter gex_summary.json gerechnet)"
              exit 1
            fi
            docker exec seasonalpha-app python3 scripts/compute_key_levels.py 2>&1 | tail -20 \
              || { echo "FEHLER: compute_key_levels (Exit ${PIPESTATUS[0]})"; fail=1; }
            echo "Key Levels done: $(date)"
            exit $fail
