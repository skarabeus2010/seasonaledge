name: Restart Nginx with latest config

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/seasonaledge
            echo "=== Git pull ==="
            git checkout -- landing/ 2>/dev/null || true
            git pull origin master
            bash deploy/inject_credentials.sh /opt/seasonaledge

            echo "=== Nginx config test ==="
            docker compose exec -T nginx nginx -t 2>&1 || true

            echo "=== Restart Nginx ==="
            docker compose restart nginx
            sleep 2

            echo "=== Test /umami/ route ==="
            curl -sf -o /dev/null -w "%{http_code}" http://localhost/umami/ && echo " OK" || echo " FAIL"
            curl -sf http://localhost:3000/api/heartbeat && echo " Umami direct OK"
