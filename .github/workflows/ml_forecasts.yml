name: ML Forecasts (Daily)

on:
  schedule:
    # Täglich Mo-Fr um 21:30 UTC (23:30 MESZ) — 1h nach Nightly Refresh
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Einzelner Ticker (leer = alle)'
        required: false
        default: ''

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Compute MSTL Strength on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            TICKER="${{ github.event.inputs.ticker }}"

            ARGS="--models mstl --progress-every 10"
            if [ -n "$TICKER" ]; then
              ARGS="$ARGS --ticker $TICKER"
            fi

            echo "MSTL Strength: $ARGS"
            docker exec seasonalpha-app python3 scripts/compute_ml_forecasts.py $ARGS 2>&1 | tail -80
            echo "MSTL done: $(date)"
