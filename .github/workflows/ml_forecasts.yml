name: ML Forecasts (Daily)

on:
  schedule:
    # Täglich Mo-Fr um 21:30 UTC (23:30 MESZ) — 1h nach Nightly Refresh
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Einzelner Ticker (leer = alle)'
        required: false
        default: ''
      models:
        description: 'Modelle (komma-separiert)'
        required: false
        default: 'chronos,mstl,neuralprophet'

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Compute ML Forecasts on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 85m
          script: |
            TICKER="${{ github.event.inputs.ticker }}"
            MODELS="${{ github.event.inputs.models }}"
            MODELS="${MODELS:-chronos,mstl,neuralprophet}"

            ARGS="--models $MODELS --progress-every 10"
            if [ -n "$TICKER" ]; then
              ARGS="$ARGS --ticker $TICKER"
            fi

            echo "ML Forecasts: $ARGS"
            docker exec seasonalpha-app python3 scripts/compute_ml_forecasts.py $ARGS 2>&1 | tail -80
            echo "ML Forecasts done: $(date)"
