name: Polymarket Intraday Refresh (FOMC-Fenster)

# Laeuft stuendlich, aber das Script early-exitet ausserhalb des FOMC-Fensters
# (FOMC-Tag -2 bis +1 Kalendertage). So bekommen wir dichte Snapshots an den
# paar Tagen im Jahr wo Polymarket-YES sich bewegt, ohne den Rest des Jahres
# unnoetig API-Traffic zu erzeugen.
#
# Gate-Logik: scripts/polymarket_refresh.py --near-fomc-only prueft
# shared.fed_dates.is_near_fomc() und exited sauber wenn nicht aktiv.

on:
  schedule:
    - cron: '23 * * * *'       # Stuendlich :23 (off-peak, kein Clash mit :17 intraday_update)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Polymarket Snapshot (FOMC-gated)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker exec seasonalpha-app python3 scripts/polymarket_refresh.py --near-fomc-only 2>&1 | tail -20
