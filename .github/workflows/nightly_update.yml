name: Nightly Data Update

on:
  schedule:
    # Mo-Fr 20:30 UTC (22:30 MESZ) — 30 Min nach Nightly Refresh
    - cron: '30 20 * * 1-5'
  workflow_dispatch:  # Manueller Trigger

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run batch download on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            docker exec seasonalpha-app python3 -c "
            from shared.download_manager import DownloadManager
            import os, pathlib
            dm = DownloadManager(str(pathlib.Path('/app')))
            dm.batch_all()
            " 2>&1 | tail -20
            echo "Nightly update done: $(date)"
