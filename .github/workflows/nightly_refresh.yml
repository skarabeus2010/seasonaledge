name: Nightly DB Refresh

on:
  schedule:
    # Mo-Fr um 20:30 UTC (22:30 MESZ) — 30 Min nach US-Boersenschluss fuer amtliche Schlusskurse
    - cron: '30 20 * * 1-5'
    # Sonntag 17:30 UTC (19:30 MESZ) — Weekly Newsletter via Phase F
    - cron: '30 17 * * 0'
  workflow_dispatch:  # Manueller Trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 60 Minuten total (vorher 15) — der Ticker-Loop braucht fuer ~270 Ticker
    # im quick-mode ~20-40 Min. Alte 10m Timeout hat dazu gefuehrt dass
    # nur ~94 von 270 Tickern in scanner_results landeten.
    timeout-minutes: 60
    steps:
      - name: Run nightly refresh on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 55m
          script: |
            docker exec seasonalpha-app python3 scripts/nightly_refresh.py 2>&1 | tail -150
            echo "Nightly refresh done: $(date)"
