name: Nightly DB Refresh

# Der Nightly laeuft seit 2026-09-29 als systemd-Timer auf dem VPS
# (deploy/systemd/sa-nightly.timer, 16:45 New Yorker Zeit = 45 min nach US-Schluss).
# Vorher liefen zwei Ausloeser parallel: die Root-Crontab (20:30 UTC) und dieser
# Workflow (Cron 20:30, real 23:00-00:30 UTC) — ein doppelter Lauf pro Tag.
# Dieser Workflow ist nur noch der manuelle Notausloeser und startet DIESELBE
# Unit: laeuft gerade ein Timer-Lauf, wartet systemctl auf dessen Ende statt
# einen zweiten zu starten. Exit-Code des Nightly wird weitergereicht.

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: sa-nightly.service auf dem VPS starten
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 100m
          script: |
            rc=0
            systemctl start sa-nightly.service || rc=$?
            journalctl -u sa-nightly.service -n 60 --no-pager
            exit $rc
