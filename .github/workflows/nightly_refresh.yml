name: Nightly DB Refresh

on:
  schedule:
    # Mo-Fr um 20:00 UTC (22:00 MESZ) — nach US-Boersenschluss
    - cron: '0 20 * * 1-5'
  workflow_dispatch:  # Manueller Trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run nightly refresh on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            docker exec seasonalpha-app python3 scripts/nightly_refresh.py 2>&1 | tail -30
            echo "Nightly refresh done: $(date)"
