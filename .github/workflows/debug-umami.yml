name: Debug Umami

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check Umami logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/seasonaledge
            echo "=== Docker PS ==="
            docker compose ps
            echo ""
            echo "=== Umami Logs (last 30) ==="
            docker compose logs umami --tail 30 2>&1 || echo "No umami logs"
            echo ""
            echo "=== Umami-DB Logs (last 15) ==="
            docker compose logs umami-db --tail 15 2>&1 || echo "No umami-db logs"
            echo ""
            echo "=== .env Umami vars ==="
            grep UMAMI /opt/seasonaledge/.env | sed 's/=.*/=***/'
            echo ""
            echo "=== Test DB connection ==="
            docker compose exec -T umami-db pg_isready -U umami 2>&1 || echo "DB not ready"
            echo ""
            echo "=== Test login admin/umami ==="
            curl -sf -X POST http://localhost:3000/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"umami"}' 2>&1 | head -c 100
            echo ""
