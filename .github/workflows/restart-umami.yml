name: Restart Umami

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart Umami container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/seasonaledge
            git checkout -- landing/ 2>/dev/null || true
            git pull origin master
            bash deploy/inject_credentials.sh /opt/seasonaledge

            echo "=== Recreate Umami with new env ==="
            docker compose up -d --force-recreate umami
            sleep 15

            echo "=== Restart Nginx ==="
            docker compose restart nginx
            sleep 2

            echo "=== Status ==="
            docker compose ps umami
            curl -sf http://localhost:3000/umami/api/heartbeat && echo "Umami OK (via BASE_PATH)" || \
            curl -sf http://localhost:3000/api/heartbeat && echo "Umami OK (root path)" || \
            echo "Umami not responding"
