name: Event Data Daily Refresh

# Taeglicher Refresh fuer Dividenden + Earnings (Yahoo Finance) nach Supabase.
# Eigenstaendiger Cron analog polymarket_daily.yml — NICHT via nightly_refresh.py,
# damit Yahoo-Rate-Limits + Retries nicht den Nightly-Hauptlauf blockieren.
#
# 269 Ticker x ~0.5s sleep x 2 Endpoints (chart?events=div + quoteSummary) =>
# Laufzeit ~5-8 min. Yahoo 429-Backoff ist im Script implementiert.

on:
  schedule:
    # 22:15 UTC taeglich — NACH polymarket_daily (21:30) + NACH US-Close (20:00).
    - cron: '15 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Welche Events ziehen?"
        required: false
        default: both
        type: choice
        options:
          - both
          - dividends
          - earnings
      tickers:
        description: "Optional: Liste von Tickern (Space-getrennt). Leer = alle aus symbols.py."
        required: false
        default: ""
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch dividend + earnings events
        uses: appleboy/ssh-action@v1
        env:
          SA_EVENT:   ${{ github.event_name }}
          SA_MODE:    ${{ github.event.inputs.mode }}
          SA_TICKERS: ${{ github.event.inputs.tickers }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          envs: SA_EVENT,SA_MODE,SA_TICKERS
          script: |
            set -uo pipefail
            # FAIL-CLOSED: eine nicht angekommene Eingabe darf nicht in den
            # Standard fallen. Auf dem Zeitplan sind die Variablen gesetzt und
            # LEER, bei Transportfehler UNGESETZT — ${VAR?} unterscheidet das.
            : "${SA_EVENT?Uebertragung fehlgeschlagen: SA_EVENT fehlt}"
            : "${SA_MODE?Uebertragung fehlgeschlagen: SA_MODE fehlt}"
            : "${SA_TICKERS?Uebertragung fehlgeschlagen: SA_TICKERS fehlt}"

            MODE="${SA_MODE:-both}"
            case "$MODE" in
              both|dividends|earnings) ;;
              *) echo "[event-data-daily] FEHLER: unbekannter Modus '$MODE'"; exit 1 ;;
            esac

            # Die Tickerliste wird ABSICHTLICH in Woerter geteilt (--tickers nimmt
            # mehrere). Sie zu quotieren wuerde die Argumentaufteilung aendern.
            # Deshalb wird jedes Wort einzeln gegen die Tickerform geprueft und in
            # ein Array gelegt — Aufteilung ja, Freitext nein.
            args=(--mode "$MODE")
            if [ -n "$SA_TICKERS" ]; then
              read -r -a _tk <<< "$SA_TICKERS"
              for t in "${_tk[@]}"; do
                case "$t" in
                  *[!A-Za-z0-9.^=-]*)
                    echo "[event-data-daily] FEHLER: '$t' ist kein Ticker"; exit 1 ;;
                esac
              done
              args+=(--tickers "${_tk[@]}")
            fi

            echo "[event-data-daily] event=$SA_EVENT args=${args[*]}"
            docker exec seasonalpha-app python3 scripts/fetch_event_data.py \
              "${args[@]}" 2>&1 | tail -60

            echo "[event-data-daily] Done: $(date)"
