name: Full Scanner Run (Weekly)

on:
  schedule:
    # Sonntags um 03:00 UTC (05:00 MESZ) — wenn keine anderen Jobs laufen
    # und Supabase-Latency am niedrigsten ist
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick-Mode (schneller, weniger akkurat)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      limit:
        description: 'Nur erste N Ticker (optional, leer = alle)'
        required: false
        default: ''
        type: string
      resume:
        description: 'Resume: Ticker ueberspringen die heute schon gescannt sind'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  full-scan:
    runs-on: ubuntu-latest
    # 90 Minuten Gesamt-Timeout: reicht fuer ~270 Ticker im Full-Mode
    # (erfahrungsgemaess ~15-30s pro Ticker je nach Download + Compute)
    timeout-minutes: 90
    steps:
      - name: Run full scanner on VPS
        uses: appleboy/ssh-action@v1
        env:
          SA_EVENT:  ${{ github.event_name }}
          SA_QUICK:  ${{ github.event.inputs.quick }}
          SA_RESUME: ${{ github.event.inputs.resume }}
          SA_LIMIT:  ${{ github.event.inputs.limit }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SA_EVENT,SA_QUICK,SA_RESUME,SA_LIMIT
          # 85 Minuten SSH-Command-Timeout (5 Min Buffer zu Job-Timeout)
          command_timeout: 85m
          script: |
            set -uo pipefail
            # FAIL-CLOSED: eine nicht angekommene Eingabe darf nicht in den
            # Standard fallen. Auf dem Zeitplan sind die Variablen gesetzt und
            # LEER, bei Transportfehler UNGESETZT — ${VAR?} unterscheidet das.
            : "${SA_EVENT?Uebertragung fehlgeschlagen: SA_EVENT fehlt}"
            : "${SA_QUICK?Uebertragung fehlgeschlagen: SA_QUICK fehlt}"
            : "${SA_RESUME?Uebertragung fehlgeschlagen: SA_RESUME fehlt}"
            : "${SA_LIMIT?Uebertragung fehlgeschlagen: SA_LIMIT fehlt}"
            if [ "$SA_EVENT" = "workflow_dispatch" ]; then
              for wert in "$SA_QUICK" "$SA_RESUME"; do
                case "$wert" in
                  true|false) ;;
                  *) echo "[full_scanner] FEHLER: Boolean ist '$wert'"; exit 1 ;;
                esac
              done
            fi
            args=()
            if [ "$SA_QUICK" = "true" ];  then args+=(--quick); fi
            if [ "$SA_RESUME" = "true" ]; then args+=(--resume); fi
            if [ -n "$SA_LIMIT" ]; then
              # Nur eine Zahl. Ein leeres --limit waere ein nackter Schalter und
              # wuerde den Parser scheitern lassen; alles andere ist Freitext in
              # der Kommandozeile.
              case "$SA_LIMIT" in
                *[!0-9]*) echo "[full_scanner] FEHLER: limit ist keine Zahl"; exit 1 ;;
              esac
              args+=(--limit "$SA_LIMIT")
            fi

            echo "[full_scanner] event=$SA_EVENT args=${args[*]-}"
            docker exec seasonalpha-app python3 scripts/full_scanner_run.py ${args[@]+"${args[@]}"} 2>&1 | tail -300
            RC=${PIPESTATUS[0]}
            echo "[full_scanner] Exit code: $RC"
            echo "[full_scanner] Finished: $(date)"
            exit $RC
