name: Reset Umami Admin Password

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Full DB reset and fresh init
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/seasonaledge

            echo "=== 1. Stop + remove Umami + DB ==="
            docker compose stop umami umami-db
            docker compose rm -f umami umami-db
            for v in $(docker volume ls -q | grep umami); do
              echo "  Removing volume: $v"
              docker volume rm "$v" 2>/dev/null || true
            done

            echo "=== 2. Fresh start ==="
            docker compose up -d umami-db
            sleep 8
            docker compose up -d umami
            sleep 20

            echo "=== 3. Check ==="
            docker compose ps umami umami-db
            docker compose logs umami --tail 5 2>&1

            echo ""
            echo "=== 4. Test default login: admin / umami ==="
            RESP=$(curl -sf -X POST http://localhost:3000/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"umami"}' 2>&1)
            echo "$RESP" | head -c 300
            echo ""
            if echo "$RESP" | grep -q "token"; then
              echo "LOGIN OK! Default: admin / umami"
            else
              echo "Default pw failed, trying empty..."
              curl -sf -X POST http://localhost:3000/api/auth/login \
                -H 'Content-Type: application/json' \
                -d '{"username":"admin","password":""}' 2>&1 | head -c 200
              echo ""
            fi
