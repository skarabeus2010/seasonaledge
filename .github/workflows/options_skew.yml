name: Options Skew & Vol

# KEIN Zeitplan mehr. Der regulaere Lauf ist sa-options-skew.timer auf dem VPS
# (deploy/systemd/, Mo-Fr 23:00 UTC, installiert von deploy/install_timers.sh im Deploy).
#
# WARUM: GitHub startete den Cron `0 23 * * 1-5` Stunden zu spaet (zuletzt 03:55 UTC), und
# am 18.11.2026 riss die SSH-Verbindung der Action ab — die Skripte waren um 04:24 UTC fertig
# und hatten geschrieben, der Workflow wartete trotzdem bis zum Limit und meldete „failed".
# Ein `schedule`-Eintrag hier wuerde den Lauf zusaetzlich zum Timer starten (Doppellauf).
#
# Dieser Workflow ist nur noch der NOTAUSLOESER (z. B. Nachholen nach einem Serverausfall,
# ausserhalb der US-Handelszeit) und startet dieselbe Unit. Er wartet auf ihr Ende (~30 min).

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: sa-options-skew.service auf dem VPS starten
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 80m
          script: |
            rc=0
            systemctl start sa-options-skew.service || rc=$?
            journalctl -u sa-options-skew.service -n 60 --no-pager
            exit $rc
