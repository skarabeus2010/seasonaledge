name: Options Skew & Vol

on:
  schedule:
    - cron: '0 23 * * 1-5'    # werktags 23:00 UTC (nach US-Close) — ^SKEW/^VIX + 25Δ-Skew
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Options skew run via VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 50m
          script: |
            echo "[options-skew] start $(date)"
            docker exec seasonalpha-app python3 scripts/compute_options_skew.py 2>&1 | tail -20
            echo "[iv-surface] start $(date)"
            docker exec seasonalpha-app python3 scripts/compute_iv_surface.py 2>&1 | tail -15
            echo "[options-skew] done $(date)"
