name: Options Skew & Vol

on:
  schedule:
    - cron: '0 23 * * 1-5'    # werktags 23:00 UTC (nach US-Close) — ^SKEW/^VIX + 25Δ-Skew
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Options skew run via VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 50m
          script: |
            # pipefail: ohne ihn liefert `docker exec … | tail -20` den Status von
            # tail (immer 0), und der abschliessende echo setzt den Exit-Code des
            # Skripts — ein fehlgeschlagener Lauf waere doppelt unsichtbar.
            # Kein `set -e`: die drei Schritte sind unabhaengig (verschiedene
            # Ausgabedateien), ein gescheiterter darf die anderen nicht verdecken.
            set -uo pipefail
            fail=0
            for s in compute_options_skew compute_iv_surface compute_options_flow; do
              echo "[$s] start $(date)"
              docker exec seasonalpha-app python3 "scripts/$s.py" 2>&1 | tail -20 \
                || { echo "FEHLER: $s (Exit ${PIPESTATUS[0]})"; fail=1; }
            done
            echo "[options-skew] done $(date)"
            exit $fail
