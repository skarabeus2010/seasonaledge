# Temporaere Nginx-Config OHNE SSL
# Nur fuer den ersten Start, damit Certbot das Zertifikat holen kann.
# Danach ersetzen durch nginx.conf (mit SSL).

server {
    listen 80;
    server_name seasonalpha.ai www.seasonalpha.ai;

    # Certbot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Streamlit (temporaer ueber HTTP)
    location / {
        proxy_pass http://app:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
