# Temporaere Nginx-Config OHNE SSL
# Nur fuer den ersten Start, damit Certbot das Zertifikat holen kann.
# Danach ersetzen durch nginx.conf (mit SSL).

server {
    listen 80;
    server_name seasonalpha.ai www.seasonalpha.ai;

    # Certbot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Bis das Zertifikat da ist, nur ein Platzhalter (der app-Container hat
    # seit 2026-10-09 keinen Webserver mehr; das Frontend ist statisches HTML).
    location / {
        default_type text/plain;
        return 503 "SeasonAlpha: Einrichtung laeuft\n";
    }
}
