# Nginx Reverse Proxy fuer SeasonAlpha
# / → Landing Page (statisches HTML)
# /app/ → Streamlit (Port 8501)
# SSL via Let's Encrypt (Certbot)

# HTTP → HTTPS Redirect
server {
    listen 80;
    server_name seasonalpha.ai www.seasonalpha.ai;

    # Certbot Challenge (fuer SSL-Zertifikat)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Alles andere → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (SSL)
server {
    listen 443 ssl;
    server_name seasonalpha.ai www.seasonalpha.ai;

    # SSL-Zertifikate (von Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/seasonalpha.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seasonalpha.ai/privkey.pem;

    # SSL-Einstellungen (modern, sicher)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Landing Page (statisches HTML) ──────────────────
    location = / {
        rewrite ^ /landing/index.html break;
        root /app;
        add_header Cache-Control "public, max-age=3600";
    }

    # Landing Page Assets (Fonts, Images, CSS, HTML)
    location /landing/ {
        alias /app/landing/;
        types { text/html html; text/css css; application/javascript js; image/svg+xml svg; image/png png; }
        default_type text/html;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Streamlit App unter /app/ ───────────────────────
    location /app/ {
        proxy_pass http://app:8501/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (Streamlit braucht das)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (Streamlit kann bei Berechnungen laenger brauchen)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
    location = /app {
        return 301 /app/;
    }

    # Streamlit interne Pfade (muessen direkt durchgereicht werden)
    location /_stcore/ {
        proxy_pass http://app:8501/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /static/ {
        proxy_pass http://app:8501/static/;
    }
    location /vendor/ {
        proxy_pass http://app:8501/vendor/;
    }
    location /component/ {
        proxy_pass http://app:8501/component/;
    }

    # ── SEO Landing Pages ───────────────────────────────
    location /analyse/ {
        alias /app/seo/output/;
        try_files $uri $uri.html =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Google Search Console Verifizierung
    location = /google85fed48a233d6c1f.html {
        alias /app/seo/output/google85fed48a233d6c1f.html;
    }

    # ── Tools ───────────────────────────────────────────
    location /tools/ {
        alias /app/seo/tools/;
        try_files $uri $uri.html =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Blog ────────────────────────────────────────────
    location /blog/ {
        alias /app/blog/output/;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /blog {
        return 301 /blog/;
    }

    # ── Statische HTML-Pages ──────────────────────────────
    location = /dekadenzyklus {
        rewrite ^ /landing/pages/dekadenzyklus.html break;
        root /app;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /mondphasen {
        rewrite ^ /landing/pages/mondphasen.html break;
        root /app;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /kriegszeiten {
        rewrite ^ /landing/pages/kriegszeiten.html break;
        root /app;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /monatswechsel {
        rewrite ^ /landing/pages/monatswechsel.html break;
        root /app;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Rechtliches (Impressum, Datenschutz, Risk) ──────
    location = /rechtliches {
        rewrite ^ /landing/rechtliches.html break;
        root /app;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Disclaimer ──────────────────────────────────────
    location = /disclaimer {
        alias /app/seo/output/disclaimer.html;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Statische Dateien ───────────────────────────────
    location = /robots.txt {
        alias /app/static/robots.txt;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        alias /app/static/sitemap.xml;
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=86400";
    }

    # Groesse fuer Uploads
    client_max_body_size 10M;
}
