# Nginx Reverse Proxy fuer SeasonAlpha
# / → Landing Page (statisches HTML)
# /app/ → Streamlit (Port 8501)
# SSL via Let's Encrypt (Certbot)

# HTTP umami.seasonalpha.ai → HTTPS (+ Certbot Challenge)
server {
    listen 80;
    server_name umami.seasonalpha.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://umami.seasonalpha.ai$request_uri;
    }
}

# HTTPS umami Dashboard
# Cert-Pfad: /live/seasonalpha.ai/ — nach certbot --expand deckt er auch umami.* ab
server {
    listen 443 ssl;
    server_name umami.seasonalpha.ai;

    ssl_certificate /etc/letsencrypt/live/seasonalpha.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seasonalpha.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://umami:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# HTTP → HTTPS Redirect (non-www, also www wird hier schon auf non-www gezwungen)
server {
    listen 80;
    server_name seasonalpha.ai;

    # Certbot Challenge (fuer SSL-Zertifikat)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Alles andere → HTTPS non-www
    location / {
        return 301 https://seasonalpha.ai$request_uri;
    }
}

# HTTP www → HTTPS non-www (301 Canonicalization)
server {
    listen 80;
    server_name www.seasonalpha.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://seasonalpha.ai$request_uri;
    }
}

# HTTPS www → HTTPS non-www (301 Canonicalization)
# Muss VOR dem non-www HTTPS-Block stehen damit nginx den www-Host matcht
server {
    listen 443 ssl;
    server_name www.seasonalpha.ai;

    ssl_certificate /etc/letsencrypt/live/seasonalpha.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seasonalpha.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://seasonalpha.ai$request_uri;
}

# HTTPS (SSL)
server {
    listen 443 ssl;
    server_name seasonalpha.ai;

    # SSL-Zertifikate (von Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/seasonalpha.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seasonalpha.ai/privkey.pem;

    # SSL-Einstellungen (modern, sicher)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Landing Page (statisches HTML) ──────────────────
    location = / {
        rewrite ^ /landing/index.html break;
        root /app;
        add_header Cache-Control "public, max-age=3600";
    }

    # Landing CSS/JS: immer ETag-revalidieren damit Deploys sofort wirken
    # (sonst haengt Mobile Safari 24h auf der alten Version)
    location ~* ^/landing/.+\.(css|js)$ {
        root /app;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        etag on;
    }

    # Shared Components (nav.html, footer.html) muessen immer aktuell sein —
    # werden per loadComponent() in JEDE Page injiziert, Aenderungen dort
    # muessen sofort wirken. Sonst sieht der User bis zu 24h eine alte Nav.
    location ~* ^/landing/components/.+\.html$ {
        root /app;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        etag on;
    }

    # IndexNow Key-File am Host-Root (Standard-Konform fuer Bing/Yandex)
    # Muss exakt an https://seasonalpha.ai/{key}.txt erreichbar sein
    location = /c0d4540dc5a10d464d473960f4d20be3.txt {
        alias /app/landing/assets/indexnow-key.txt;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    # ── /landing/pages/*.html direkt blockieren ───────────────────────
    # Google crawlt diese URLs und meldet 274× "Alternative Seite mit
    # kanonischem Tag" in GSC. Die Pages sollen NUR über Clean-URLs
    # (/dashboard, /jahreszyklus etc.) erreichbar sein.
    location ~* ^/landing/pages/.*\.html$ {
        return 404;
    }

    # Landing Page Assets (Fonts, Images, HTML, TXT fuer IndexNow-Key)
    location /landing/ {
        alias /app/landing/;
        types { text/html html; text/css css; application/javascript js; image/svg+xml svg; image/png png; text/plain txt; image/x-icon ico; image/webp webp; application/json json; }
        default_type text/html;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Streamlit App unter /app/ ───────────────────────
    location /app/ {
        proxy_pass http://app:8501/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (Streamlit braucht das)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (Streamlit kann bei Berechnungen laenger brauchen)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
    location = /app {
        return 301 /app/;
    }

    # Streamlit interne Pfade (muessen direkt durchgereicht werden)
    location /_stcore/ {
        proxy_pass http://app:8501/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /static/ {
        proxy_pass http://app:8501/static/;
    }
    location /vendor/ {
        proxy_pass http://app:8501/vendor/;
    }
    location /component/ {
        proxy_pass http://app:8501/component/;
    }

    # ── SEO Landing Pages /analyse/* permanent gelöscht ─────────────────
    # 2026-04-18: Thin-Content-Experiment endgültig beerdigt. 410 Gone
    # signalisiert Google "dauerhaft weg" (schnellere Deindexierung als 404).
    # Builder erzeugt keine /analyse/-Pages mehr, vorhandene Files werden
    # vom Builder-Cleanup beim nächsten Deploy aus seo/output/ entfernt.
    location /analyse/ {
        add_header Cache-Control "no-store" always;
        return 410;
    }

    # Google Search Console Verifizierung
    location = /google85fed48a233d6c1f.html {
        alias /app/seo/output/google85fed48a233d6c1f.html;
    }

    # ── Tools ───────────────────────────────────────────
    location /tools/ {
        alias /app/seo/tools/;
        try_files $uri $uri.html =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Blog ────────────────────────────────────────────
    location /blog/ {
        alias /app/blog/output/;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /blog {
        return 301 /blog/;
    }

    # ── Statische HTML-Pages ──────────────────────────────
    location = /dekadenzyklus {
        rewrite ^ /landing/pages/dekadenzyklus.html break;
        root /app;
        add_header Cache-Control "public, max-age=3600";
