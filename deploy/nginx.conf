        add_header Cache-Control "public, max-age=3600";
    }

    # ── Watchlist (Local-First, Premium-ready) ──────────
    location = /watchlist {
        rewrite ^ /landing/pages/watchlist.html break;
        root /app;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── User-Profil (eingeloggt only, personalisiert → no-store) ──────
    location = /profile {
        rewrite ^ /landing/pages/profile.html break;
        root /app;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── Unsubscribe (Newsletter-Abmeldung via Token) ────
    location = /unsubscribe {
        rewrite ^ /landing/pages/unsubscribe.html break;
        root /app;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── Rechtliches (Impressum, Datenschutz, Risk) ──────
    location = /rechtliches {
        rewrite ^ /landing/rechtliches.html break;
        root /app;
        add_header Cache-Control "public, max-age=86400";
    }
    # Alte/alternative Pfade → Redirect auf /rechtliches
    location = /impressum {
        return 301 /rechtliches;
    }
    location = /datenschutz {
        return 301 /rechtliches;
    }

    # ── Disclaimer ──────────────────────────────────────
    location = /disclaimer {
        alias /app/seo/output/disclaimer.html;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Statische Dateien ───────────────────────────────
    location = /robots.txt {
        alias /app/static/robots.txt;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        alias /app/static/sitemap.xml;
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Umami Tracking-Script + API (DSGVO-konform) ──────
    # Nur für script.js + /api/send — Dashboard ist unter umami.seasonalpha.ai
    location /umami/ {
        proxy_pass http://umami:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Groesse fuer Uploads
    client_max_body_size 10M;
}
