# Nginx Reverse Proxy fuer SeasonalAlpha
# Leitet seasonalpha.ai → Streamlit (Port 8501) weiter
# SSL via Let's Encrypt (Certbot)

# HTTP → HTTPS Redirect
server {
    listen 80;
    server_name seasonalpha.ai www.seasonalpha.ai;

    # Certbot Challenge (fuer SSL-Zertifikat)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Alles andere → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (SSL)
server {
    listen 443 ssl;
    server_name seasonalpha.ai www.seasonalpha.ai;

    # SSL-Zertifikate (von Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/seasonalpha.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seasonalpha.ai/privkey.pem;

    # SSL-Einstellungen (modern, sicher)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Streamlit Reverse Proxy
    location / {
        proxy_pass http://app:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (Streamlit braucht das)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (Streamlit kann bei Berechnungen laenger brauchen)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Statische Dateien (robots.txt, sitemap)
    location /robots.txt {
        alias /var/www/certbot/robots.txt;
    }

    # Groesse fuer Uploads
    client_max_body_size 10M;
}
