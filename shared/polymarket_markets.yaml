# SeasonAlpha — Kuratiertes Polymarket-Market-Set
# ==================================================
# Aufbau: 5 Kategorien, ca. 30 Maerkte, versioniert im Git.
#
# Struktur pro Eintrag:
#   slug          — stabiler URL-/DB-Slug (lowercase, bindestrich-separiert)
#   category      — 'fed','macro','index','events','crypto'
#   refresh       — 'hourly','daily'
#   search_terms  — Keywords fuer automatische Discovery (siehe scripts/polymarket_discover.py)
#   condition_id  — Polymarket Condition-ID (wird durch Discovery-Script gefuellt)
#
# Workflow:
#   1. Neue Eintraege manuell hinzufuegen (nur slug + category + refresh + search_terms)
#   2. py scripts/polymarket_discover.py --update-yaml ausfuehren
#      -> fuellt automatisch condition_id + question + end_date
#   3. py scripts/polymarket_backfill.py --slug <slug>
#   4. Cron uebernimmt ab dann den Rest

version: 1
updated: 2026-04-17

markets:
