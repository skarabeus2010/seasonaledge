<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ApexCharts Demo &mdash; SeasonAlpha</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/landing/css/app.css">
</head>
<body>

  <!-- Nav (per JS geladen) -->
  <div id="nav-container"></div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h3>Einstellungen</h3>
      <input type="text" value="^DJI" placeholder="Ticker">
      <label><input type="checkbox" checked> &plusmn;1&sigma; Konfidenzband</label>
      <label><input type="checkbox"> Einzeljahre anzeigen</label>
      <label><input type="checkbox" checked> Aktuelles Jahr</label>
      <hr>
      <h3>Vola-Fenster</h3>
      <select><option>10</option><option selected>20</option><option>30</option><option>60</option></select>
      <hr>
      <h3>Dekaden-Filter</h3>
      <label><input type="checkbox" checked> x0</label>
      <label><input type="checkbox" checked> x1</label>
      <label><input type="checkbox" checked> x2</label>
      <label><input type="checkbox" checked> x3</label>
      <label><input type="checkbox" checked> x4</label>
      <label><input type="checkbox" checked> x5</label>
      <label><input type="checkbox" checked> x6 (aktuell)</label>
      <label><input type="checkbox" checked> x7</label>
      <label><input type="checkbox" checked> x8</label>
      <label><input type="checkbox" checked> x9</label>
    </aside>

    <!-- Main Content -->
    <main>
      <!-- KPI Cards -->
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-label">Kohorte</div><div class="kpi-value gold">x6-Jahre</div></div>
        <div class="kpi"><div class="kpi-label">&Oslash; Rendite</div><div class="kpi-value green">+8.45%</div></div>
        <div class="kpi"><div class="kpi-label">Median</div><div class="kpi-value green">+6.20%</div></div>
        <div class="kpi"><div class="kpi-label">Win-Rate</div><div class="kpi-value">69%</div></div>
        <div class="kpi"><div class="kpi-label">Volatilit&auml;t</div><div class="kpi-value">14.2%</div></div>
      </div>

      <!-- Chart 1: Dekaden-Linien -->
      <div class="chart-box"><div id="chart-lines"></div></div>

      <!-- Chart 2: Bar -->
      <details open>
        <summary>&Oslash; Jahresrendite nach Dekade</summary>
        <div class="content"><div id="chart-bar"></div></div>
      </details>

      <!-- Chart 3: Heatmap -->
      <details open>
        <summary>Monatsrendite nach Dekade</summary>
        <div class="content"><div id="chart-heatmap"></div></div>
      </details>

      <!-- Chart 4: Box-Plot -->
      <details>
        <summary>Rendite-Verteilung (Box-Plot)</summary>
        <div class="content"><div id="chart-box"></div></div>
      </details>

      <h2 class="section-header">Drawdown &amp; Risiko</h2>

      <!-- Chart 5: Drawdown -->
      <details open>
        <summary>&Oslash; Drawdown-Verlauf</summary>
        <div class="content"><div id="chart-dd"></div></div>
      </details>

      <!-- Chart 6: DD-Heatmap -->
      <details>
        <summary>Max Drawdown: Dekade &times; Monat</summary>
        <div class="content"><div id="chart-dd-heatmap"></div></div>
      </details>

      <!-- Chart 7: Volatilität -->
      <details>
        <summary>Rolling Volatilit&auml;t</summary>
        <div class="content"><div id="chart-vola"></div></div>
      </details>
    </main>
  </div>

  <!-- Footer (per JS geladen) -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/landing/js/auth.js"></script>
  <script src="/landing/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@4"></script>
  <script src="/landing/js/charts.js"></script>
  <script>
    // ── Demo-Daten (Random) ──
    function rand(a,b){return a+Math.random()*(b-a)}
    function curve(n,d,v){var c=[0];for(var i=1;i<n;i++)c.push(c[i-1]+d+v*(Math.random()-.5));return c}

    // Chart 1: Dekaden-Linien
    var s1=SA.DECADE_LABELS.map(function(l,i){return{name:l,data:curve(252,rand(.02,.06),rand(.8,1.5)),color:SA.DECADE_COLORS[i]}});
    s1.push({name:'2026',data:curve(63,.04,1),color:'#FFE600'});
    SA.lineChart('chart-lines',s1,{title:'^DJI \u2014 Intra-Decade Seasonality',strokeWidth:s1.map(function(_,i){return i===10?3:1.5})});

    // Chart 2: Bar
    var bd=SA.DECADE_LABELS.map(function(){return parseFloat(rand(-5,15).toFixed(2))});
    SA.barChart('chart-bar',SA.DECADE_LABELS,bd,{seriesName:'\u00d8 Return'});

    // Chart 3: Heatmap
    var hm=SA.DECADE_LABELS.map(function(l){return{name:l,data:SA.MONTHS.map(function(m){return{x:m,y:parseFloat(rand(-3,4).toFixed(2))}})}}).reverse();
    SA.heatmapChart('chart-heatmap',hm);

    // Chart 4: Box-Plot
    var bp=SA.DECADE_LABELS.map(function(l){var v=Array.from({length:13},function(){return rand(-20,40)}).sort(function(a,b){return a-b});return{x:l,y:[v[0],v[3],v[6],v[9],v[12]].map(function(x){return parseFloat(x.toFixed(1))})};});
    SA.boxPlotChart('chart-box',bp);

    // Chart 5: Drawdown
    var dd=SA.DECADE_LABELS.map(function(l,i){var c=curve(252,-.01,.5),p=c[0];return{name:l,data:c.map(function(v){if(v>p)p=v;return parseFloat((v-p).toFixed(2))}),color:SA.DECADE_COLORS[i]}});
    SA.lineChart('chart-dd',dd,{height:350,yaxis:{labels:{formatter:function(v){return v.toFixed(0)+'%'}}}});

    // Chart 6: DD-Heatmap
    var dh=SA.DECADE_LABELS.map(function(l){return{name:l,data:SA.MONTHS.map(function(m){return{x:m,y:parseFloat(rand(-15,-1).toFixed(1))}})}}).reverse();
    SA.heatmapChart('chart-dd-heatmap',dh,{negativeOnly:true});

    // Chart 7: Volatilität
    var vo=SA.DECADE_LABELS.map(function(l,i){return{name:l,data:curve(252,0,.3).map(function(v){return parseFloat((12+v).toFixed(2))}),color:SA.DECADE_COLORS[i]}});
    SA.lineChart('chart-vola',vo,{height:320});
  </script>
</body>
</html>
